<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#2a2f36"/>
  <!-- sidewalk -->
  <rect x="0" y="0" width="800" height="380" fill="#c7cbd1"/>
  <g stroke="#aeb3bb" stroke-width="2">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="650" y1="0" x2="650" y2="380"/>
  </g>
  <!-- curb edge -->
  <rect x="0" y="378" width="800" height="14" fill="#7d8390"/>
  <!-- road -->
  <rect x="0" y="392" width="800" height="208" fill="#26292e"/>
  <!-- opposite crosswalk, aligned with the missing ramp's target column -->
  <g fill="#e7e9ec">
    <rect x="250" y="470" width="26" height="130"/>
    <rect x="292" y="470" width="26" height="130"/>
    <rect x="334" y="470" width="26" height="130"/>
    <rect x="376" y="470" width="26" height="130"/>
  </g>
  <!-- tree -->
  <circle cx="620" cy="150" r="34" fill="#3ea86b"/>
  <rect x="612" y="180" width="16" height="60" fill="#7a5230"/>
  <!-- lamp post -->
  <rect x="90" y="180" width="8" height="200" fill="#5c6570"/>
  <circle cx="94" cy="176" r="10" fill="#e0b34a"/>
</svg>
