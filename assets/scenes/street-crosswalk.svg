<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#2a2f36"/>
  <!-- sidewalks left/right -->
  <rect x="0" y="0" width="220" height="600" fill="#454c56"/>
  <rect x="580" y="0" width="220" height="600" fill="#454c56"/>
  <!-- road -->
  <rect x="220" y="0" width="360" height="600" fill="#26292e"/>
  <!-- lane divider -->
  <g stroke="#c8ccd2" stroke-width="6" stroke-dasharray="26 20">
    <line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="400" y1="440" x2="400" y2="600"/>
  </g>
  <!-- crosswalk zebra stripes -->
  <g fill="#e7e9ec">
    <rect x="250" y="300" width="300" height="14"/>
    <rect x="250" y="326" width="300" height="14"/>
    <rect x="250" y="352" width="300" height="14"/>
    <rect x="250" y="378" width="300" height="14"/>
    <rect x="250" y="404" width="300" height="14"/>
  </g>
  <!-- curb lines -->
  <rect x="220" y="0" width="6" height="600" fill="#5c6470"/>
  <rect x="574" y="0" width="6" height="600" fill="#5c6470"/>
  <!-- traffic light pole -->
  <rect x="600" y="120" width="10" height="140" fill="#3a3f47"/>
  <rect x="580" y="90" width="50" height="70" rx="6" fill="#22262b"/>
  <circle cx="605" cy="108" r="10" fill="#e05a5a"/>
  <circle cx="605" cy="132" r="10" fill="#3a3f47"/>
  <circle cx="605" cy="156" r="10" fill="#3a3f47"/>
  <!-- parked/passing car silhouette -->
  <g fill="#37699c">
    <rect x="270" y="470" width="120" height="50" rx="10"/>
    <rect x="292" y="450" width="70" height="30" rx="8"/>
  </g>
  <circle cx="295" cy="522" r="12" fill="#161a1e"/>
  <circle cx="365" cy="522" r="12" fill="#161a1e"/>
</svg>
