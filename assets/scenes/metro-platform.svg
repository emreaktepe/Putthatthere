<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect x="0" y="0" width="800" height="600" fill="#1c232d"/>
  <!-- tunnel arch -->
  <path d="M -20 380 Q 400 180 820 380 L 820 460 L -20 460 Z" fill="#0c1016"/>
  <rect x="0" y="440" width="800" height="30" fill="#05070a"/>
  <!-- track bed / void beyond edge -->
  <rect x="0" y="460" width="800" height="140" fill="#0a0d12"/>
  <rect x="40" y="480" width="720" height="8" fill="#3a3f47"/>
  <rect x="40" y="560" width="720" height="8" fill="#3a3f47"/>
  <!-- platform floor -->
  <rect x="0" y="0" width="800" height="460" fill="#2c333d" transform="translate(0,0)"/>
  <rect x="0" y="300" width="800" height="160" fill="#333b46"/>
  <!-- platform edge line -->
  <rect x="0" y="452" width="800" height="8" fill="#e0b34a"/>
  <!-- floor tile texture -->
  <g stroke="#3d4552" stroke-width="1" opacity="0.6">
    <line x1="0" y1="340" x2="800" y2="340"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="100" y1="300" x2="100" y2="452"/>
    <line x1="300" y1="300" x2="300" y2="452"/>
    <line x1="500" y1="300" x2="500" y2="452"/>
    <line x1="700" y1="300" x2="700" y2="452"/>
  </g>
  <!-- sign -->
  <rect x="60" y="60" width="140" height="34" rx="4" fill="#e0b34a"/>
  <text x="130" y="83" font-size="16" font-family="sans-serif" fill="#1c232d" text-anchor="middle">M2 HATTI</text>
  <!-- passengers waiting further back from edge -->
  <g fill="#5a6472">
    <circle cx="180" cy="320" r="12"/><rect x="168" y="332" width="24" height="46" rx="8"/>
    <circle cx="560" cy="330" r="12"/><rect x="548" y="342" width="24" height="46" rx="8"/>
    <circle cx="640" cy="322" r="12"/><rect x="628" y="334" width="24" height="46" rx="8"/>
  </g>
  <!-- support columns -->
  <rect x="380" y="150" width="24" height="160" fill="#40485570"/>
</svg>
