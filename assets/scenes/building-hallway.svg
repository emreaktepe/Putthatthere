<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#dfe3e8"/>
  <!-- ceiling band -->
  <rect x="0" y="0" width="800" height="50" fill="#c3c9d1"/>
  <g fill="#f4f6f8" stroke="#aeb5bf" stroke-width="1">
    <rect x="80" y="14" width="90" height="20"/>
    <rect x="360" y="14" width="90" height="20"/>
    <rect x="640" y="14" width="90" height="20"/>
  </g>
  <!-- floor -->
  <rect x="0" y="500" width="800" height="100" fill="#b8bcc2"/>
  <g stroke="#9aa0a8" stroke-width="2">
    <line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="150" y1="500" x2="150" y2="600"/>
    <line x1="400" y1="500" x2="400" y2="600"/>
    <line x1="650" y1="500" x2="650" y2="600"/>
  </g>
  <!-- wall skirting -->
  <rect x="0" y="490" width="800" height="10" fill="#9aa0a8"/>
  <!-- doors -->
  <g fill="#8a94a3">
    <rect x="60" y="150" width="80" height="340"/>
    <rect x="660" y="150" width="80" height="340"/>
  </g>
  <g fill="#5c6570">
    <circle cx="130" cy="330" r="5"/>
    <circle cx="670" cy="330" r="5"/>
  </g>
  <!-- exit sign with directional arrow, near an exit route -->
  <rect x="600" y="60" width="110" height="34" rx="4" fill="#3ea86b"/>
  <text x="655" y="83" font-size="16" font-family="sans-serif" fill="#fff" text-anchor="middle">ÇIKIŞ →</text>
  <!-- blank wall panel where the extinguisher bracket belongs -->
  <rect x="540" y="150" width="100" height="340" fill="#e9ecef" stroke="#c3c9d1" stroke-width="2"/>
</svg>
