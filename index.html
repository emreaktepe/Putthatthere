<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Büyücünün Gecesi — Three.js demo</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<link rel="stylesheet" href="./css/game.css" />
</head>
<body>
<div id="hud">
  <span id="level"></span><span id="goal"></span><span id="hearts"></span><span id="time"></span><span id="score"></span><span id="boss"></span>
</div>
<div id="weapons"></div>
<div id="abil"></div>
<div id="joy"><i></i></div>
<button id="fire" aria-label="Büyü yap">✦</button>
<div id="tint"></div>
<div id="haze"></div>
<div id="hurt"></div>
<div id="toast"></div>
<div id="msg"><h1 id="title"></h1><p id="sub"></p><div id="btns"></div></div>
<button id="mute" aria-label="Sesi kapat" title="Sesi kapat">🔊</button>
<!-- file:// ile açılırsa ES modülleri tarayıcıda yüklenmez; bu yüzden uyarı modül değil, bu küçük klasik betikten gelir
     (metin js/config/load.js FILE_PROTOCOL_MESSAGE ile aynı olmalı). -->
<script>
  if (location.protocol === "file:") {
    document.getElementById("title").textContent = "Sunucu gerekli";
    document.getElementById("sub").textContent = "Bu oyun bir sunucudan açılmalı: dosyaya çift tıklamak (file://) tarayıcıda çalışmaz. Proje klasöründe `npx serve . -l 8000` çalıştırıp http://localhost:8000 adresini açın.";
  }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
