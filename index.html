<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Şunu Şuraya Koy — Put That There</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="app">

  <section id="screen-intro" class="screen">
    <div class="intro-card">
      <h1 id="intro-title"></h1>
      <p id="intro-body"></p>
      <button id="btn-start" class="btn btn-primary"></button>
    </div>
  </section>

  <section id="screen-game" class="screen" hidden>
    <header id="topbar">
      <span id="scene-counter"></span>
      <span id="scene-title"></span>
      <span id="score-label"></span>
      <button id="btn-lang" class="btn btn-ghost"></button>
    </header>

    <div id="canvas-wrap">
      <canvas id="scene-canvas"></canvas>
      <p id="pick-up-hint" class="floating-hint"></p>
      <p id="orbit-hint" class="floating-hint hint-bottom"></p>
      <p id="rotate-hint" class="floating-hint hint-rotate" hidden></p>
    </div>

    <footer id="bottombar">
      <div id="tray" title="">
        <canvas id="tray-canvas"></canvas>
      </div>
      <button id="btn-confirm" class="btn btn-primary" disabled></button>
    </footer>

    <div id="result-modal" class="modal-overlay" hidden>
      <div class="modal-card">
        <div id="result-stars" class="stars"></div>
        <p id="result-message"></p>
        <p id="result-explanation" class="explanation"></p>
        <p id="result-error" class="metric"></p>
        <p id="result-placement-score" class="metric"></p>
        <p id="result-running-total" class="metric"></p>
        <button id="btn-next-scene" class="btn btn-primary"></button>
      </div>
    </div>
  </section>

  <section id="screen-final" class="screen" hidden>
    <div class="intro-card">
      <h1 id="final-title"></h1>
      <p id="final-score"></p>
      <p id="final-stars"></p>
      <p id="final-rank"></p>
      <button id="btn-play-again" class="btn btn-primary"></button>
    </div>
  </section>

  <p id="error-banner" class="error-banner" hidden></p>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
