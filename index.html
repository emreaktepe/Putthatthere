<html lang="tr">

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #0a0714; font-family: Georgia, "Times New Roman", serif; color: #f1e6ff; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 12px; left: 0; right: 0; padding: 0 56px; box-sizing: border-box; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 26px; font-size: 19px; pointer-events: none; text-shadow: 0 0 8px #8e44ff, 0 2px 6px #000; }
  #hearts { letter-spacing: 3px; color: #ff7a93; }
  #hearts .half { opacity: .4; }
  #boss { color: #ff9a9a; }
  #weapons { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; justify-content: safe center; gap: 8px; overflow-x: auto; padding: 4px 10px; box-sizing: border-box; touch-action: pan-x; scrollbar-width: none; }
  #weapons::-webkit-scrollbar { display: none; }
  .wbtn { flex: 0 0 auto; white-space: nowrap; font-family: inherit; font-size: 15px; padding: 8px 14px; border: 1px solid #6b4fb0; border-radius: 8px; background: rgba(30,15,60,.8); color: #cdb8ff; cursor: pointer; }
  .wbtn.active { border-color: #fff; background: #5128a8; color: #fff; box-shadow: 0 0 12px #8e44ff; }
  .wbtn.locked { opacity: .35; cursor: default; }
  #abil { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: 70px; display: flex; gap: 8px; }
  .abtn { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 2px solid #9ad7ff; background: rgba(20,50,110,.7); color: #fff; font-size: 22px; padding: 0; cursor: pointer; touch-action: none; box-shadow: 0 0 10px #3a8cff; }
  .abtn .ak { position: absolute; left: 3px; top: 0; font-size: 11px; opacity: .85; font-family: inherit; }
  .abtn .acd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 19px; font-family: inherit; border-radius: 50%; }
  .abtn.cd { opacity: .55; box-shadow: none; }
  .abtn.cd .acd { background: rgba(0,0,0,.55); }
  body:not(.playing) #abil { display: none; }
  #toast { position: fixed; top: 14%; left: 0; right: 0; text-align: center; padding: 0 16px; font-size: 22px; pointer-events: none; text-shadow: 0 0 10px #8e44ff, 0 2px 6px #000; opacity: 0; transition: opacity .4s; }
  #toast.show { opacity: 1; }
  #tint { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(90,160,255,0) 40%, rgba(90,160,255,.35)); opacity: 0; transition: opacity .2s; }
  body.slowtime #tint { opacity: 1; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(40,15,80,.82), rgba(5,3,12,.94)); text-align: center; gap: 12px; padding: 0 20px; }
  #msg[hidden] { display: none; }
  #btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  h1 { font-size: 42px; margin: 0; color: #d9b3ff; text-shadow: 0 0 18px #8e44ff; max-width: 92vw; }
  p { margin: 0; max-width: 560px; line-height: 1.5; }
  p b { color: #ffe9a8; }
  .gbtn { font-family: inherit; font-size: 17px; padding: 10px 24px; border: 1px solid #d9b3ff; border-radius: 8px; background: #3a1d7a; color: #fff; cursor: pointer; box-shadow: 0 0 14px #8e44ff; }
  .gbtn:hover { background: #5128a8; }
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(217,179,255,.5); background: rgba(80,40,160,.2); pointer-events: none; display: none; }
  #joy i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(217,179,255,.75); box-shadow: 0 0 12px #8e44ff; }
  #fire { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: 74px; width: 92px; height: 92px; border-radius: 50%; border: 2px solid #fff; background: rgba(120,50,220,.6); color: #fff; font-size: 34px; box-shadow: 0 0 18px #8e44ff; display: none; touch-action: none; }
  #fire:active { background: rgba(160,90,255,.85); }
  body.touch #fire { display: block; }
  body.touch.playing #fire { display: block; }
  body.touch #abil { bottom: 176px; }
  body:not(.playing) #fire, body:not(.playing) #joy { display: none !important; }
  .wbtn .k { opacity: .7; }
  @media (max-width: 700px), (pointer: coarse) {
    #hud { font-size: 14px; gap: 4px 14px; top: max(6px, env(safe-area-inset-top)); }
    h1 { font-size: 30px; }
    p { font-size: 15px; }
    #toast { font-size: 17px; }
    #msg { overflow-y: auto; justify-content: flex-start; padding-top: 8vh; padding-bottom: 20px; }
    .wbtn { font-size: 18px; padding: 8px 10px; }
    .wbtn .wn, .wbtn .k { display: none; }
    #weapons { bottom: max(12px, env(safe-area-inset-bottom)); gap: 6px; }
    .gbtn { font-size: 16px; padding: 12px 18px; }
  }
  .gbtn small { display: block; font-size: 13px; color: #cdb8ff; margin-top: 3px; }
  #mute { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 6; width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 1px solid #6b4fb0; background: rgba(30,15,60,.75); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; touch-action: manipulation; }
  #mute:hover { background: rgba(81,40,168,.85); }
  #hurt { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,40,70,0) 45%, rgba(255,40,70,.55)); opacity: 0; }
  #hurt.on { animation: hurtflash .35s ease-out; }
  @keyframes hurtflash { from { opacity: 1; } to { opacity: 0; } }
  #haze { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 70% 40% at 18% 0%, var(--moon, #b9c7ff), rgba(0,0,0,0) 70%); opacity: .16; mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="hud">
  <span id="level"></span><span id="goal"></span><span id="hearts"></span><span id="time"></span><span id="score"></span><span id="boss"></span>
</div>
<div id="weapons"></div>
<div id="abil"></div>
<div id="joy"><i></i></div>
<button id="fire" aria-label="Büyü yap">✦</button>
<div id="tint"></div>
<div id="haze"></div>
<div id="hurt"></div>
<div id="toast"></div>
<div id="msg"><h1 id="title"></h1><p id="sub"></p><div id="btns"></div></div>
<button id="mute" aria-label="Sesi kapat" title="Sesi kapat">🔊</button>
<script type="module">
import * as THREE from "three";

const ARENA = 14;
const BASE_SPEED = 8;
const START_HP = 3;

const $ = (id) => document.getElementById(id);
const rand = (r) => (Math.random() * 2 - 1) * r;
const mat = (o) => new THREE.MeshStandardMaterial(o);

// ---------- Ses motoru (P4): Web Audio ile sentez, harici dosya yok ----------
// Olay adları: cast:<büyü id>, hit, kill:<düşman tipi>, hurt, shield_block, shield_break, pickup:<crystal|heart|light>,
// ability:<id>, level_clear, game_over, phase:<n>, boss_shield_break, boss_shield_up, telegraph, slam, explode,
// enemy_shot, totem_down, meteor_hit, nova, toast, click. Müzik: mus.set("menu"|"play"|"boss", tema), mus.intensity(0-1).
const SOUND_KEY = "buyucu_ses";
const AUDIO = (() => {
  // root: MIDI kök; scale: yarım ton dizisi; chords: gam derecesi (üçlü: d, d+2, d+4); bpm; cut: pad filtresi (Hz)
  const MUSIC = [
    { root: 50, scale: [0, 2, 3, 5, 7, 9, 10], bpm: 66, chords: [0, 3, 0, 6], cut: 700, arpP: 0.5, arpWave: "triangle", bellP: 0.45, wind: 0.5, motif: true },
    { root: 52, scale: [0, 1, 3, 5, 7, 8, 10], bpm: 60, chords: [0, 1, 0, 6], cut: 520, arpP: 0.3, arpWave: "sine", arpDec: 0.5, bellP: 0.6, wind: 0.3, padVol: 0.08 },
    { root: 48, scale: [0, 3, 5, 7, 10], bpm: 72, chords: [0, 0, 2, 4], cut: 640, arpP: 0.15, arpWave: "triangle", bellP: 0.4, wind: 0.35, drumThr: 0.3, kick: [0, 10], tomLow: true, noHat: true },
    { root: 45, scale: [0, 2, 3, 5, 7, 8, 11], bpm: 76, chords: [0, 3, 4, 0], cut: 650, arpP: 0.28, arpWave: "triangle", arpOct: 12, bellP: 0.55, wind: 0.4, detune: 13 },
    { root: 52, scale: [0, 2, 4, 6, 7, 9, 11], bpm: 84, chords: [0, 1, 4, 1], cut: 1400, arpP: 0.8, arpWave: "triangle", arpOct: 12, arpDec: 0.18, bellP: 0.75, bellOct: 36, wind: 0.9 },
    { root: 50, scale: [0, 1, 4, 5, 7, 8, 10], bpm: 96, chords: [0, 1, 0, 6], cut: 900, arpP: 0.7, arpWave: "square", arpVol: 0.07, bellP: 0.3, wind: 0.4, drumThr: 0.1, kick: [0, 6, 8, 12], burst: true },
    { root: 55, scale: [0, 2, 4, 6, 7, 9, 11], bpm: 88, chords: [0, 1, 4, 0], cut: 1800, arpP: 0.8, arpWave: "triangle", arpOct: 12, bellP: 0.85, wind: 0.3, detune: 10, padVol: 0.1 },
    { root: 49, scale: [0, 2, 3, 5, 6, 8, 9, 11], bpm: 80, chords: [0, 3, 6, 4], cut: 600, arpP: 0.25, arpWave: "triangle", arpRepeat: true, bellP: 0.35, wind: 0.5, detune: 18, drumThr: 0.35, kick: [0, 10], tomLow: true, noHat: true },
    { root: 50, scale: [0, 2, 3, 5, 7, 8, 11], bpm: 108, chords: [0, 5, 0, 4], chordBars: 1, cut: 2200, arpP: 0.6, arpWave: "square", arpVol: 0.07, bellP: 0.2, wind: 0.3, pad4: true, padAtt: 0.25, kick: [0, 4, 8, 12], detune: 9 },
  ];
  // Boss Faz 3 (Pırıl teması): D majör pentatonik, ritimsiz, çan melodisi
  const P3 = { ...MUSIC[8], scale: [0, 2, 4, 7, 9], chords: [3, 0, 1, 3], cut: 1200, padAtt: 1.2, pad4: false, chordBars: 1 };
  const MOTIF0 = [0, 2, 7, 9, 7, 2];
  const MOTIF3 = [0, 2, 4, 7, 9, 7, 4, 2];

  const touch = matchMedia("(pointer: coarse)").matches;
  let ctx = null, master = null, musicGain = null, dry = null, revIn = null, noiseBuf = null, padFilter = null, windGain = null;
  const buses = {};
  let live = 0, timer = 0, hidden = document.hidden, failed = false, on = true;
  try { on = localStorage.getItem(SOUND_KEY) !== "0"; } catch (e) { /* özel mod */ }
  const st = { mode: "menu", theme: 0, target: 0, smooth: 0, step: 0, nextT: 0, phase: 1, burstUntil: 0, arpIdx: 5, lastArp: -1, motif: 0, crystal: 0, busT: 0 };
  const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const cfgOf = () => (st.mode === "menu" ? MUSIC[0] : st.mode === "boss" && st.phase === 3 ? P3 : MUSIC[st.theme] || MUSIC[0]);
  const degNote = (c, d) => { const n = c.scale.length; return c.root + c.scale[((d % n) + n) % n] + 12 * Math.floor(d / n); };

  function init() {
    if (ctx || failed) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { failed = true; return; }
    master = ctx.createGain();
    master.gain.value = on ? 0.25 : 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.25;
    master.connect(comp); comp.connect(ctx.destination);
    dry = ctx.createGain(); dry.connect(master);
    // yankı: gürültüden üstel sönümlü impulse (mobilde daha kısa)
    const conv = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * (touch ? 1.2 : 1.8));
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    conv.buffer = ir;
    revIn = ctx.createGain();
    const wet = ctx.createGain(); wet.gain.value = 0.25;
    revIn.connect(conv); conv.connect(wet); wet.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    musicGain = ctx.createGain(); musicGain.connect(dry);
    const mkBus = (name, vol, rev, music = true) => {
      const g = ctx.createGain(); g.gain.value = vol; g.connect(music ? musicGain : dry);
      const r = ctx.createGain(); r.gain.value = rev; g.connect(r); r.connect(revIn);
      buses[name] = g;
    };
    mkBus("pad", 0.55, 0.5); mkBus("arp", 0.4, 0.9); mkBus("bell", 0.5, 0.9); mkBus("drone", 0.6, 0.2);
    mkBus("wind", 0.6, 0.3); mkBus("drum", 0.6, 0.1); mkBus("bass", 0.6, 0.1); mkBus("sfx", 0.9, 0.35, false);
    // kalıcı düğümler: pad filtresi + LFO, rüzgâr
    padFilter = ctx.createBiquadFilter(); padFilter.type = "lowpass"; padFilter.frequency.value = 800; padFilter.Q.value = 0.7; padFilter.connect(buses.pad);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.08;
    const lg = ctx.createGain(); lg.gain.value = 250; lfo.connect(lg); lg.connect(padFilter.frequency); lfo.start();
    const ws = ctx.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
    const wf = ctx.createBiquadFilter(); wf.type = "bandpass"; wf.frequency.value = 500; wf.Q.value = 0.8;
    windGain = ctx.createGain(); windGain.gain.value = 0;
    ws.connect(wf); wf.connect(windGain); windGain.connect(buses.wind);
    const wl = ctx.createOscillator(); wl.frequency.value = 0.07;
    const wlg = ctx.createGain(); wlg.gain.value = 250; wl.connect(wlg); wlg.connect(wf.frequency);
    ws.start(); wl.start();
    // iOS kilidini açmak için sessiz tampon
    const sb = ctx.createBufferSource(); sb.buffer = ctx.createBuffer(1, 1, 22050); sb.connect(ctx.destination); sb.start(0);
    ctx.onstatechange = () => { if (ctx.state === "running" && on && !hidden) startTimer(); else stopTimer(); };
    updateBuses();
    if (ctx.state === "running") startTimer();
  }

  // ---- çekirdek yardımcılar ----
  function voice(type, f0, f1, t, dur, peak, dest, o = {}) {
    if (live >= (o.cap || 28)) return null;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    if (o.det) osc.detune.value = o.det;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + (o.a || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(dest);
    live++;
    osc.onended = () => { live--; g.disconnect(); };
    osc.start(t); osc.stop(t + dur + 0.05);
    return osc;
  }
  function noise(t, dur, peak, dest, o = {}) {
    if (live >= 30) return;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = o.type || "lowpass"; f.Q.value = o.q || 0.7;
    f.frequency.setValueAtTime(o.f0 || 1000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest);
    live++;
    src.onended = () => { live--; g.disconnect(); };
    src.start(t, Math.random() * 0.8, dur + 0.05);
  }
  function bell(f, t, vel = 1, dec = 2.5, dest = buses.bell) {
    voice("sine", f, f, t, dec, 0.16 * vel, dest);
    voice("sine", f * 2.76, f * 2.76, t, dec * 0.6, 0.08 * vel, dest);
    voice("sine", f * 5.4, f * 5.4, t, dec * 0.35, 0.04 * vel, dest);
  }
  function padChord(cfg, notes, t, dur) {
    const att = cfg.padAtt || 1.5, rel = 1.6, peak = cfg.padVol || 0.09, det = cfg.detune || 7;
    for (const n of notes) for (const dt of [-det, det]) {
      if (live >= 26) return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.value = mtof(n); o.detune.value = dt;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + att);
      g.gain.setValueAtTime(peak, t + Math.max(dur - 0.1, att));
      g.gain.linearRampToValueAtTime(0.0001, t + dur + rel);
      o.connect(g); g.connect(padFilter);
      live++;
      o.onended = () => { live--; g.disconnect(); };
      o.start(t); o.stop(t + dur + rel + 0.05);
    }
  }
  function kick(t, low) {
    voice("sine", low ? 90 : 120, low ? 38 : 50, t, low ? 0.35 : 0.22, 0.5, buses.drum);
  }
  function hat(t, v) { noise(t, 0.03, 0.09 * v, buses.drum, { type: "highpass", f0: 7000 }); }

  function arpNote(cfg) {
    const n = cfg.scale.length, hi = n * 2 - 1;
    st.arpIdx = Math.min(st.arpIdx, hi);
    if (cfg.arpRepeat) { if (Math.random() < 0.08) st.arpIdx = Math.floor(Math.random() * n); }
    else {
      let i = st.arpIdx + pick([-2, -1, 1, 2]);
      if (i < 0) i = 1;
      if (i > hi) i = hi - 1;
      if (i === st.lastArp) i = Math.min(i + 1, hi);
      st.arpIdx = i;
    }
    st.lastArp = st.arpIdx;
    return degNote(cfg, st.arpIdx) + 12 + (cfg.arpOct || 0);
  }

  // 16'lık adım başına zamanlama
  function stepFn(t) {
    const cfg = cfgOf(), boss = st.mode === "boss", menu = st.mode === "menu";
    const sd = 60 / cfg.bpm / 4, s = st.step % 16, bar = Math.floor(st.step / 16);
    const inten = menu ? 0 : boss ? 1 : st.smooth;
    const p3 = boss && st.phase === 3 && t > st.burstUntil; // Pırıl teması: ritim susar
    const cb = cfg.chordBars || 2;
    if (s === 0 && bar % cb === 0) {
      const c = cfg.chords[(bar / cb) % cfg.chords.length];
      const notes = [degNote(cfg, c), degNote(cfg, c + 2), degNote(cfg, c + 4)];
      if (cfg.pad4) notes.push(notes[0] + 12);
      padChord(cfg, notes, t, cb * sd * 16);
    }
    if (s === 0 && bar % 4 === 0) { // bas/drone: kök + bir oktav altı (+ beşli)
      const dur = sd * 64, r = cfg.root - 12;
      voice("sine", mtof(r), mtof(r), t, dur, 0.1, buses.drone, { a: 1 });
      voice("sine", mtof(r - 12), mtof(r - 12), t, dur, 0.1, buses.drone, { a: 1 });
      if (cfg === MUSIC[2]) voice("sine", mtof(r + 7), mtof(r + 7), t, dur, 0.05, buses.drone, { a: 1 });
    }
    // çan / Pırıl motifi
    if (p3) {
      if (s === 0 || s === 8) bell(mtof(cfg.root + 12 + MOTIF3[st.motif++ % MOTIF3.length]), t, 0.9, 2.5);
    } else if (s === 0 && (!menu || bar % 2 === 0) && Math.random() < cfg.bellP * (menu ? 0.5 : 1)) {
      let n;
      if (cfg.motif) n = cfg.root + 12 + MOTIF0[st.motif++ % MOTIF0.length];
      else n = degNote(cfg, pick([0, 2, 4])) + (cfg.bellOct || 24);
      bell(mtof(n), t, 0.8);
    }
    // arp
    if (!p3 && !menu && cfg.arpP > 0) {
      const fast = boss ? st.phase >= 2 : inten > 0.5;
      if (s % (fast ? 1 : 2) === 0 && Math.random() < cfg.arpP * (fast ? 0.8 : 1)) {
        const f = mtof(arpNote(cfg));
        voice(cfg.arpWave || "triangle", f, f, t, cfg.arpDec || 0.25, cfg.arpVol || 0.12, buses.arp, { cap: 22 });
      }
    }
    // ritim + bas yürüyüşü
    if (!menu && !p3 && (boss || inten > (cfg.drumThr || 0.5))) {
      const strong = boss || inten > 0.8;
      if ((cfg.kick || [0, 8]).includes(s) || (strong && !cfg.kick && (s === 4 || s === 12))) kick(t, cfg.tomLow);
      if (!cfg.noHat) {
        const fastHat = (boss && st.phase >= 2) || inten > 0.8;
        if (fastHat ? true : s % 4 === 2) hat(t, fastHat && s % 2 ? 0.5 : 1);
      }
      if (strong && s % 4 === 0) {
        const q = (bar * 4 + s / 4) % 4;
        const deg = boss ? [0, 5, 0, 4][q] : [0, 0, 4, 0][q];
        const f = mtof(degNote(cfg, deg) - 12);
        voice("sine", f, f, t, sd * 3, 0.22, buses.bass, { cap: 24 });
        voice("triangle", f, f, t, sd * 3, 0.1, buses.bass, { cap: 24 });
      }
    }
    if (cfg.burst && !menu && inten > 0.2 && s % 4 === 2 && Math.random() < 0.25) noise(t, 0.08, 0.08, buses.drum, { type: "bandpass", f0: 3000, q: 1 });
  }

  function updateBuses() {
    if (!ctx) return;
    const cfg = cfgOf(), now = ctx.currentTime, menu = st.mode === "menu";

const FLOOR_KIND = ["grass", "wet", "flag", "dirt", "snow", "ash", "facet", "bone", "tile"];
function drawFloor(ti) {
  const g = floorCtx, W = floorCanvas.width, R = mulberry(ti * 7919 + 13), k = W / 512, kind = FLOOR_KIND[ti];
  g.globalAlpha = 1;
  g.fillStyle = "#bdbdbd"; g.fillRect(0, 0, W, W);
  const blot = (n, a, r0, r1) => {
    for (let i = 0; i < n; i++) {
      const x = R() * W, y = R() * W, r = (r0 + R() * (r1 - r0)) * k, v = R() < 0.5 ? 0 : 255;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(${v},${v},${v},${a})`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`);
      g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  };
  const dots = (n, a, s) => { for (let i = 0; i < n; i++) { const v = (R() * 255) | 0; g.fillStyle = `rgba(${v},${v},${v},${a})`; g.fillRect(R() * W, R() * W, s * k, s * k); } };
  const lines = (n, len, a, w, light) => {
    g.lineWidth = w * k; g.strokeStyle = light ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
    for (let i = 0; i < n; i++) { const x = R() * W, y = R() * W, an = R() * 6.28, l = len * k * (0.3 + R()); g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(an) * l, y + Math.sin(an) * l); g.stroke(); }
  };
  const cracks = (n, steps, a) => {
    for (let i = 0; i < n; i++) {
      let x = R() * W, y = R() * W, an = R() * 6.28;
      g.strokeStyle = `rgba(0,0,0,${a})`; g.lineWidth = (1 + R()) * k; g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < steps; s++) { an += (R() - 0.5) * 1.2; x += Math.cos(an) * (10 + R() * 18) * k; y += Math.sin(an) * (10 + R() * 18) * k; g.lineTo(x, y); }
      g.stroke();
    }
  };
  blot(60, 0.22, 30, 90); blot(40, 0.15, 20, 60);
  switch (kind) {
    case "grass": dots(2500, 0.25, 1.5); lines(900, 10, 0.35, 1, true); lines(500, 10, 0.3, 1, false); blot(10, 0.2, 15, 30); break;
    case "wet": blot(25, 0.3, 20, 50); cracks(10, 8, 0.35); dots(1500, 0.2, 1); break;
    case "flag": {
      const sz = 64 * k;
      for (let y = 0; y < W; y += sz) for (let x = 0; x < W; x += sz) { const v = (R() * 255) | 0; g.fillStyle = `rgba(${v},${v},${v},.16)`; g.fillRect(x, y, sz, sz); }
      g.strokeStyle = "rgba(0,0,0,.5)"; g.lineWidth = 2 * k;
      for (let p = 0; p <= W; p += sz) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, W); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(W, p); g.stroke(); }
      cracks(14, 6, 0.4); dots(1500, 0.2, 1.5); break;
    }
    case "dirt": dots(3000, 0.3, 2); lines(600, 8, 0.3, 1, true); cracks(8, 6, 0.3); break;
    case "snow": blot(80, 0.2, 15, 50); dots(1800, 0.4, 1.5); lines(30, 60, 0.25, 1, true); cracks(6, 5, 0.2); break;
    case "ash": cracks(30, 10, 0.5); dots(2500, 0.3, 2); blot(30, 0.3, 10, 30); break;
    case "facet":
      for (let i = 0; i < 40; i++) { const v = (R() * 255) | 0; g.fillStyle = `rgba(${v},${v},${v},.12)`; g.beginPath(); g.moveTo(R() * W, R() * W); g.lineTo(R() * W, R() * W); g.lineTo(R() * W, R() * W); g.fill(); }
      lines(60, 70, 0.2, 1.5, true); cracks(8, 6, 0.25); break;
    case "bone": cracks(22, 9, 0.45); dots(2000, 0.3, 2); lines(40, 14, 0.4, 2, true); break;
    default: {
      const sz = 128 * k;
      for (let y = 0; y < W; y += sz) for (let x = 0; x < W; x += sz) { g.fillStyle = ((x + y) / sz) % 2 ? "rgba(0,0,0,.12)" : "rgba(255,255,255,.08)"; g.fillRect(x, y, sz, sz); }
      g.strokeStyle = "rgba(0,0,0,.45)"; g.lineWidth = 2 * k;
      for (let p = 0; p <= W; p += sz) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, W); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(W, p); g.stroke(); }
      cracks(10, 6, 0.4);
    }
  }
  floorTex.needsUpdate = true;
}

let wCfg = { n: 0, vy: 0, dx: 0 };
function setWeather(w) {
  wCfg = w;
  weatherGeo.setDrawRange(0, w.n);
  weatherMat.color.setHex(w.col);
  weatherMat.size = w.size;
  weatherMat.opacity = w.op || 0.8;
  weatherMat.blending = w.add ? THREE.AdditiveBlending : THREE.NormalBlending;
  weatherMat.needsUpdate = true;
}
function updateWeather(dt, t) {
  const cx = wizard.position.x * 0.6, cz = wizard.position.z * 0.6;
  for (let i = 0; i < wCfg.n; i++) {
    const j = i * 3;
    wPos[j] += (wCfg.dx + Math.sin(t * 0.7 + wRnd[i] * 20) * 0.35) * dt;
    wPos[j + 1] += wCfg.vy * (0.6 + wRnd[i] * 0.8) * dt;
    wPos[j + 2] += Math.cos(t * 0.5 + wRnd[i] * 20) * 0.25 * dt;
    if (wPos[j + 1] > 12) wPos[j + 1] = 0; else if (wPos[j + 1] < 0) wPos[j + 1] = 12;
    if (wPos[j] - cx > 20) wPos[j] -= 40; else if (wPos[j] - cx < -20) wPos[j] += 40;
    if (wPos[j + 2] - cz > 20) wPos[j + 2] -= 40; else if (wPos[j + 2] - cz < -20) wPos[j + 2] += 40;
  }
  weatherGeo.attributes.position.needsUpdate = true;
}

function applyTheme(i) {
  const t = THEMES[i], v = VIS[i];
  scene.background.setHex(t.bg);
  scene.fog.color.setHex(t.bg);
  floorMat.color.setHex(t.floor).multiplyScalar(2);
  outerMat.color.setHex(t.floor).multiplyScalar(0.45);
  borderMat.color.setHex(t.ring);
  ring.material.color.setHex(t.ring);
  hemi.color.setHex(t.hemi);
  moon.color.setHex(t.moon);
  moonHalo.material.color.setHex(t.moon);
  skyU.top.value.setHex(t.hemi).multiplyScalar(0.3);
  skyU.bot.value.setHex(t.bg);
  baseFog = t.fog;
  scene.fog.density = baseFog / camK;
  mistMats[0].color.setHex(t.hemi); mistMats[1].color.setHex(t.hemi);
  mistMats[0].opacity = v.mist; mistMats[1].opacity = v.mist * 0.7;
  setWeather(v.w);
  document.documentElement.style.setProperty("--moon", "#" + t.moon.toString(16).padStart(6, "0"));
  if (i !== curTheme) { // dekor yalnız tema değişince yenilenir
    curTheme = i;
    drawFloor(i);
    clearScenery();
    fireCfg.base = 0; fireLight.intensity = 0;
    SCENERY[i]();

}

const sceneryGroup = new THREE.Group();
scene.add(sceneryGroup);
let sc = { disp: [], anim: [] };
function clearScenery() {
  for (const o of [...sceneryGroup.children]) sceneryGroup.remove(o);
  for (const d of sc.disp) d.dispose();
  sc = { disp: [], anim: [] };
}
const smat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, flatShading: true, ...o });
const bmatOwn = (color, o = {}) => new THREE.MeshBasicMaterial({ color, ...o });
function addInst(geo, material, mats, colors) {
  if (!mats.length) return null;
  const im = new THREE.InstancedMesh(geo, material, mats.length);
  mats.forEach((m, i) => im.setMatrixAt(i, m));
  if (colors) colors.forEach((c, i) => im.setColorAt(i, c));
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.frustumCulled = false;
  sceneryGroup.add(im);
  sc.disp.push(material, im, geo); // dekor geometrileri her kurulumda yeni üretilir; önbellekteki (GC) olanlar buraya verilmez
  return im;
}
function addObj(o, ...own) { sceneryGroup.add(o); sc.disp.push(...own); return o; }
function ringPos(rmin = ARENA + 1, rmax = ARENA + 9) {
  for (;;) {
    const x = rand(rmax), z = rand(rmax), d = Math.max(Math.abs(x), Math.abs(z));
    if (d >= rmin && d <= rmax) return [x, z];
  }
}
const jc = (hex, v = 0.08) => new THREE.Color(hex).offsetHSL(rand(0.02), rand(v), rand(v));
function setFireLight(x, y, z, color, intensity, mode) {

function animateWizard(dt, t) {
  const b = wiz.body;
  if (dt > 0) {
    const vx = (wizard.position.x - wiz.px) / dt, vz = (wizard.position.z - wiz.pz) / dt;
    const sp = Math.hypot(vx, vz), k = sp > 14 ? 14 / sp : 1; // ışınlanma sıçramasını yut
    wiz.vx += (vx * k - wiz.vx) * Math.min(1, dt * 10);
    wiz.vz += (vz * k - wiz.vz) * Math.min(1, dt * 10);
  }
  wiz.px = wizard.position.x; wiz.pz = wizard.position.z;
  const ry = wizard.rotation.y, sn = Math.sin(ry), cs = Math.cos(ry);
  const lf = THREE.MathUtils.clamp((wiz.vx * sn + wiz.vz * cs) / 8, -1, 1);
  const lr = THREE.MathUtils.clamp((wiz.vx * cs - wiz.vz * sn) / 8, -1, 1);
  const mv = Math.min(Math.hypot(wiz.vx, wiz.vz) / 8, 1);
  b.position.y = Math.abs(Math.sin(t * 10)) * 0.06 * mv;
  b.rotation.x = lf * 0.12;
  b.scale.y = 1 + Math.sin(t * 1.5) * 0.015 * (1 - mv);
  wiz.beard.rotation.x = Math.sin(t * 2) * 0.05 + lf * 0.25;
  wiz.beard.rotation.z = -lr * 0.15;
  wiz.hat.rotation.z = Math.sin(t * 1.3) * 0.03 - lr * 0.05;
  wiz.hat.rotation.x = -lf * 0.05;
  wiz.armL.rotation.x = 0.15 + Math.sin(t * 10) * 0.5 * mv;
  wizKick = Math.max(wizKick - dt, 0);
  const kk = wizKick / 0.18;
  wiz.armR.rotation.x = -1.0 - kk * 0.5;
  wiz.staff.position.set(0.26, 0, 0.63 + kk * 0.2);
  const pulse = 1 + 0.1 * Math.sin(t * 6);
  orbTip.scale.setScalar(pulse);
  orbTip.rotation.y = t * 1.5;
  // pelerin dalgası
  const p = wiz.capeGeo.attributes.position, base = wiz.capeBase, K = wiz.capeK;
  for (let i = 0; i < p.count; i++) {
    const k = K[i], x = base[i * 3], y = base[i * 3 + 1];
    const wave = Math.sin(t * 2 + x * 3 + y * 2) * 0.05 * k + Math.sin(t * 5 + x * 4) * 0.02 * k * mv;
    const dz = THREE.MathUtils.clamp(-lf * 0.3 * k * k, -0.4, 0.04);
    p.setXYZ(i, x - lr * 0.25 * k * k, y, base[i * 3 + 2] + dz + wave);
  }
  p.needsUpdate = true;
}

const MAX_SPARKS = 480;
const sparkPos = new Float32Array(MAX_SPARKS * 3);
const sparkCol = new Float32Array(MAX_SPARKS * 3);
const sparkBase = new Float32Array(MAX_SPARKS * 3);
const sparkVel = new Float32Array(MAX_SPARKS * 3);
const sparkLife = new Float32Array(MAX_SPARKS);
const sparkMax = new Float32Array(MAX_SPARKS).fill(0.6);
let sparkHead = 0;
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3).setUsage(THREE.DynamicDrawUsage));
sparkGeo.setAttribute("color", new THREE.BufferAttribute(sparkCol, 3).setUsage(THREE.DynamicDrawUsage));
const sparkPoints = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ size: 0.4, map: glowTex, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
sparkPoints.frustumCulled = false;
scene.add(sparkPoints);
function resetSparks() { sparkLife.fill(0); sparkPos.fill(0); for (let i = 0; i < MAX_SPARKS; i++) sparkPos[i * 3 + 1] = -100; sparkCol.fill(0); sparkGeo.attributes.position.needsUpdate = sparkGeo.attributes.color.needsUpdate = true; }
resetSparks();
const _c = new THREE.Color();
function emit(pos, color, n = 10, speed = 4, life = 0.6) {
  _c.setHex(color);
  for (let i = 0; i < n; i++) {
    const k = sparkHead; sparkHead = (sparkHead + 1) % MAX_SPARKS;
    sparkPos[k * 3] = pos.x; sparkPos[k * 3 + 1] = pos.y; sparkPos[k * 3 + 2] = pos.z;
    sparkVel[k * 3] = rand(speed); sparkVel[k * 3 + 1] = Math.random() * speed; sparkVel[k * 3 + 2] = rand(speed);
    sparkBase[k * 3] = _c.r; sparkBase[k * 3 + 1] = _c.g; sparkBase[k * 3 + 2] = _c.b;
    sparkLife[k] = sparkMax[k] = life;
  }
}
const burst = (pos, color, n = 10) => emit(pos, color, n, 4, 0.6);
function updateSparks(dt) {
  for (let k = 0; k < MAX_SPARKS; k++) {
    if (sparkLife[k] <= 0) continue;
    sparkLife[k] -= dt;
    const i = k * 3;
    if (sparkLife[k] <= 0) { sparkPos[i + 1] = -100; sparkCol[i] = sparkCol[i + 1] = sparkCol[i + 2] = 0; continue; }
    sparkPos[i] += sparkVel[i] * dt; sparkPos[i + 1] += sparkVel[i + 1] * dt; sparkPos[i + 2] += sparkVel[i + 2] * dt;
    sparkVel[i + 1] -= 9 * dt;
    const f = sparkLife[k] / sparkMax[k];
    sparkCol[i] = sparkBase[i] * f; sparkCol[i + 1] = sparkBase[i + 1] * f; sparkCol[i + 2] = sparkBase[i + 2] * f;
  }
  sparkGeo.attributes.position.needsUpdate = sparkGeo.attributes.color.needsUpdate = true;
}

  const m = new THREE.MeshStandardMaterial({
    color: d.color, emissive: d.emissive, transparent: type === "ghost" || type === "wolf", opacity: type === "ghost" ? 0.75 : type === "wolf" ? 0.85 : 1,
    roughness: 0.6, flatShading: type !== "ghost" && type !== "ember",
  });
  const out = BUILD[type](m);
  out.g.scale.setScalar(out.size);
  const obj = new THREE.Group();
  obj.add(out.g);
  const baked = bakeNode(out.g, []);
  if (type === "knight" || type === "boss") out.g.traverse((n) => { if (n.isMesh) n.castShadow = true; });
  return { obj, mat: m, base: new THREE.Vector3(d.r, d.r, d.r), anim: out.anim, baked };
}
// yavaşlama göstergesi: küçük buz kristalleri (paylaşımlı geometri/materyal)
function setIce(e, on) {
  if (on && !e.iceG) {
    e.iceG = new THREE.Group();
    for (let i = 0; i < 4; i++) { const a = (i / 4) * 6.283, c = mk(OCT(0.18), ICE_MAT, Math.cos(a) * 0.85, 0.4 + (i % 2) * 0.5, Math.sin(a) * 0.85); e.iceG.add(c); }
    e.mesh.add(e.iceG);
  }
  if (e.iceG) { e.iceG.visible = on; if (on) e.iceG.rotation.y += 0.05; }
}

const liveCount = () => enemies.reduce((n, e) => n + (e.d.noCap ? 0 : 1), 0);

function spawnEnemy(type, at) {
  const d = ENEMIES[type];
  const { obj, mat: m, base, anim, baked } = buildEnemy(type);
  if (at) obj.position.set(at.x, d.y, at.z);
  else {
    const a = Math.random() * Math.PI * 2;
    obj.position.set(Math.cos(a) * ARENA, d.y, Math.sin(a) * ARENA);
  }
  obj.scale.setScalar(0.001); // belirme animasyonu applyLook içinde büyür
  scene.add(obj);
  const e = {
    mesh: obj, mat: m, base, type, d, hp: d.hp, maxHp: d.hp, slow: 0, phase: Math.random() * 10, spd: d.speed,
    glow: 0, sq: 1, shield: 0, dead: false, st: "approach", tm: 0, cd: 0, fuse: 0,
    anim, baked, age: 0, flash: 0, kx: 0, kz: 0, blob: null, iceG: null,
  };
  if (type !== "boss" && type !== "knight") { // kontakt gölgesi: gerçek gölge yerine yumuşak daire
    e.blob = new THREE.Mesh(BLOB_GEO, BLOB_MAT);
    e.blob.scale.setScalar(d.r * 2.4);
    e.blob.position.set(obj.position.x, 0.04, obj.position.z);
    scene.add(e.blob);
  }
  burst(obj.position, d.color, 6);
  if (type === "archer") e.cd = 1 + Math.random() * 1.5;
  if (type === "priest") e.cd = 2 + Math.random() * 2;
  if (type === "totem") e.cd = 12;
  if (type === "knight") { e.cd = 4; e.wind = 0; e.enraged = false; }
  if (type === "boss") { e.bp = 1; e.shielded = false; e.vuln = 0; e.waveT = 8; }
  enemies.push(e);
  if (type === "boss" || type === "knight") bossRef = e;
  return e;
}

// kişi başına kaynaklar: ana materyal, kalkan materyali, birleştirilmiş geometriler (diğer parçalar paylaşımlıdır)
function disposeEnemy(e) {
  e.mat.dispose();
  if (e.sm) e.sm.material.dispose();
  if (e.baked) e.baked.forEach((g) => g.dispose());
  e.baked = null;
}

function setShieldVis(e, on, color) {
  if (on && !e.sm) {
    e.sm = new THREE.Mesh(shieldGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3, depthWrite: false }));
    e.mesh.add(e.sm);
  }
  if (e.sm) e.sm.visible = on;
}

// Şimşek: titrek (zigzag) çizgi, iki katman (renkli + beyaz çekirdek) ve uçta kıvılcım
function addBolt(a, b, color) {
  for (let k = 0; k < 2; k++) {
    const pts = [a.clone()], n = 7, jit = k ? 0.15 : 0.35;
    for (let i = 1; i < n; i++) pts.push(a.clone().lerp(b, i / n).add(new THREE.Vector3(rand(jit), rand(jit), rand(jit))));
    pts.push(b.clone());
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: k ? 0xffffff : color, transparent: true }));
    line.userData.life = 0.18;
    scene.add(line);
    bolts.push(line);
  }
  emit(b, color, 4, 3, 0.3);
}

// Yer işareti: delay sonunda r yarıçapında hasar (dmg 0 ise yalnızca işaret). real=true ise zaman yavaşlamasından etkilenmez.
function addHazard(x, z, r, delay, dmg, color, real = false) {
  const g = new THREE.Group();
  const rm = new THREE.Mesh(ringUnit, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
  const fill = new THREE.Mesh(discUnit, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false }));
  rm.rotation.x = fill.rotation.x = -Math.PI / 2;
  rm.scale.setScalar(r);
  fill.scale.setScalar(0.01);
  g.position.set(x, 0.05, z);
  g.add(rm, fill);
  scene.add(g);
  hazards.push({ x, z, r, t: delay, dur: delay, dmg, g, fill, mats: [rm.material, fill.material], real });
  if (dmg > 0) sfx("telegraph");
}
function dropHazard(h) { scene.remove(h.g); h.mats.forEach((m) => m.dispose()); }

// Genişleyen halka efekti
function addFx(x, z, color, r0, r1, life, y = 0.1) {
  const m = new THREE.Mesh(ringUnit, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  m.scale.setScalar(r0);
  scene.add(m);
  fxs.push({ m, t: life, life, r0, r1 });
}

const cloudGeo = new THREE.SphereGeometry(1, 14, 8);
function addCloud(x, z, dmg, o) {
  const m = new THREE.Mesh(cloudGeo, new THREE.MeshBasicMaterial({ color: 0x6bff6b, transparent: true, opacity: 0.28, depthWrite: false }));
  m.scale.set(o.r, 0.9, o.r);
  m.position.set(x, 0.6, z);
  scene.add(m);
  clouds.push({ x, z, r: o.r, life: o.life, tick: 0.5, dmg, m });
}

function removeObj(o) {
  scene.remove(o);
  if (o.isLine) { o.geometry.dispose(); o.material.dispose(); }
}

function clearWorld() {
  [...pickups.map((p) => p.mesh), ...enemies.map((e) => e.mesh), ...shots.map((s) => s.mesh), ...enemyShots.map((s) => s.mesh), ...bolts, ...clouds.map((c) => c.m), ...strikes.map((s) => s.ball), ...fxs.map((f) => f.m)].forEach(removeObj);
  hazards.forEach(dropHazard);
  clouds.forEach((c) => c.m.material.dispose());
  fxs.forEach((f) => f.m.material.dispose());
  strikes.forEach((s) => s.ball.material.dispose());
  enemies.forEach((e) => { disposeEnemy(e); if (e.blob) scene.remove(e.blob); });
  pickups.length = enemies.length = shots.length = enemyShots.length = bolts.length = hazards.length = clouds.length = strikes.length = fxs.length = echoQ.length = 0;
  resetSparks();
  bossRef = null;
  shieldT = timeslowT = 0;
}

// ---------- Girdi ----------
const keys = new Set();
const aim = new THREE.Vector3(0, 0, -1);
const aimPoint = new THREE.Vector3(0, 0, -6);
const moveDir = new THREE.Vector3(0, 0, -1);
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let joy = null; // { id, x, y, dx, dy }
let fireHeld = false;
const joyEl = $("joy"), fireEl = $("fire");
const isTouch = matchMedia("(pointer: coarse)").matches;
if (isTouch) document.body.classList.add("touch");
addEventListener("contextmenu", (e) => e.preventDefault());
addEventListener("keydown", (e) => {
  keys.add(e.code);
  if (e.code === "Space") { e.preventDefault(); cast(); }
  const m = /^Digit([1-7])$/.exec(e.code);
  if (m) selectWeapon(WEAPON_ORDER[+m[1] - 1]);
  const ab = ABILITY_ORDER.find((id) => ABILITIES[id].code === e.code);
  if (ab && !e.repeat) useAbility(ab);
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("pointermove", (e) => {
  if (e.pointerType !== "touch") mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (joy && e.pointerId === joy.id) {
    const R = 50;
    let dx = e.clientX - joy.x, dy = e.clientY - joy.y;
    const len = Math.hypot(dx, dy);
    if (len > R) { dx = (dx / len) * R; dy = (dy / len) * R; }
    joy.dx = dx / R; joy.dy = dy / R;
    joyEl.firstElementChild.style.transform = `translate(${dx}px, ${dy}px)`;
  }
});
addEventListener("pointerdown", (e) => {
  if (e.target.closest("button") || e.target.closest("#weapons")) return;
  if (e.pointerType === "touch") {
    document.body.classList.add("touch");
    if (!joy) {
      joy = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
      joyEl.style.left = e.clientX + "px";
      joyEl.style.top = e.clientY + "px";
      joyEl.style.display = "block";
      joyEl.firstElementChild.style.transform = "";
    }
  } else cast();
});
function endPointer(e) {
  if (joy && e.pointerId === joy.id) { joy = null; joyEl.style.display = "none"; }
}
addEventListener("pointerup", endPointer);
addEventListener("pointercancel", endPointer);
fireEl.addEventListener("pointerdown", (e) => { e.preventDefault(); fireHeld = true; fireEl.setPointerCapture(e.pointerId); cast(); });
const stopFire = () => { fireHeld = false; };
fireEl.addEventListener("pointerup", stopFire);
fireEl.addEventListener("pointercancel", stopFire);

function selectWeapon(id) {
  if (!id || !S.unlocked.includes(id)) return;
  S.weapon = id;
  setWandColor(WEAPONS[id].color);
  renderWeapons();
}

function renderWeapons() {
  const bar = $("weapons");
  bar.innerHTML = "";
  let activeBtn = null;
  for (const id of WEAPON_ORDER) {
    const w = WEAPONS[id];
    const b = document.createElement("button");
    const open = S.unlocked.includes(id);
    b.className = "wbtn" + (id === S.weapon ? " active" : "") + (open ? "" : " locked");
    b.innerHTML = open ? `${w.icon} <span class="k">${w.key} ·</span> <span class="wn">${w.name}</span>` : `🔒`;
    b.onclick = () => { selectWeapon(id); b.blur(); };
    bar.appendChild(b);
    if (id === S.weapon) activeBtn = b;
  }
  if (activeBtn) bar.scrollLeft = activeBtn.offsetLeft - bar.clientWidth / 2 + activeBtn.offsetWidth / 2;
}

const abilEls = {};
function renderAbilities() {
  const box = $("abil");
  box.innerHTML = "";
  for (const k of Object.keys(abilEls)) delete abilEls[k];
  for (const id of ABILITY_ORDER) {
    if (!S.abilities.includes(id)) continue;
    const a = ABILITIES[id];
    const b = document.createElement("button");
    b.className = "abtn";
    b.setAttribute("aria-label", a.name);
    b.innerHTML = `${a.icon}<span class="ak">${a.key}</span><span class="acd"></span>`;
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); useAbility(id); });
    box.appendChild(b);
    abilEls[id] = { b, cd: b.querySelector(".acd"), last: -1 };
  }
}
function updateAbilityUi() {
  for (const id of Object.keys(abilEls)) {
    const el = abilEls[id], c = Math.ceil(abilCd[id]);
    if (c !== el.last) { el.last = c; el.cd.textContent = c > 0 ? c : ""; el.b.classList.toggle("cd", c > 0); }
  }
}

let toastTimer = 0;
function toast(text, ms = 3800) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), ms);
  sfx("toast");
}

// ---------- Savaş ----------
const flatDist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

function nearestEnemies(from, n, range) {
  return enemies
    .map((e) => ({ e, d: e.mesh.position.distanceTo(from) }))
    .filter((x) => x.d <= range)
    .sort((a, b) => a.d - b.d)
    .slice(0, n)
    .map((x) => x.e);
}

function cast() {
  if (!running || cooldown > 0) return;
  const w = WEAPONS[S.weapon];
  cooldown = w.cd * S.cdMul;
  fireSpell(S.weapon);
  if (S.echo > 0 && Math.random() < S.echo) echoQ.push({ t: 0.14, id: S.weapon });
}

function fireSpell(id) {
  const w = WEAPONS[id];
  const origin = wizard.position.clone().setY(1.7);
  const dmg = w.dmg * S.dmgMul;
  sfx("cast:" + id);
  wizKick = 0.18;
  emit(origin, w.color, 4, 2, 0.3);

  if (w.chain) {
    let prev = origin;
    for (const e of nearestEnemies(origin, w.chain, w.range)) {
      const to = e.mesh.position.clone();
      addBolt(prev, to, w.color);
      hurt(e, dmg, false);
      prev = to;
    }
    if (prev === origin) addBolt(origin, origin.clone().addScaledVector(aim, 6), w.color); // hedef yoksa ileri doğru kısa şimşek
    return;
  }

  if (w.nova) {
    const p = wizard.position;
    addFx(p.x, p.z, w.color, 0.5, w.nova.r, 0.35, 0.15);
    burst(origin.clone().setY(1), w.color, 20);
    sfx("nova");
    for (const e of [...enemies]) {
      if (e.dead || flatDist(e.mesh.position, p) > w.nova.r + e.d.r * 0.5) continue;
      hurt(e, dmg, false);
      if (!e.dead && !e.d.static && e.type !== "boss" && e.type !== "knight") { // itme
        const dx = e.mesh.position.x - p.x, dz = e.mesh.position.z - p.z, l = Math.hypot(dx, dz) || 1;
        e.mesh.position.x = THREE.MathUtils.clamp(e.mesh.position.x + (dx / l) * w.nova.push, -ARENA - 1, ARENA + 1);
        e.mesh.position.z = THREE.MathUtils.clamp(e.mesh.position.z + (dz / l) * w.nova.push, -ARENA - 1, ARENA + 1);
      }
    }
    return;
  }

  if (w.meteor) {
    const x = THREE.MathUtils.clamp(aimPoint.x, -ARENA, ARENA), z = THREE.MathUtils.clamp(aimPoint.z, -ARENA, ARENA);
    const ball = new THREE.Mesh(meteorGeo, new THREE.MeshBasicMaterial({ color: w.color }));
    ball.add(glowSprite(w.color, 3.4, 0.8));
    ball.position.set(x, 14, z);
    scene.add(ball);
    addHazard(x, z, w.meteor.r, w.meteor.delay, 0, w.color, true);
    strikes.push({ x, z, t: w.meteor.delay, max: w.meteor.delay, r: w.meteor.r, dmg, ball });
    return;
  }

  const n = w.spread || 1;
  for (let i = 0; i < n; i++) {
    const ang = n === 1 ? 0 : (i - (n - 1) / 2) * 0.28;
    const v = aim.clone().applyAxisAngle(UP, ang).multiplyScalar(w.speed);
    const m = makeShot(w.color, id === "frost" ? "frost" : "");
    m.position.copy(origin);
    if (id === "frost") m.lookAt(origin.clone().add(v));
    scene.add(m);
    if (w.cloud) {
      m.scale.setScalar(1.6);
      shots.push({ mesh: m, v, life: w.cloud.dist / w.speed, cloud: w.cloud, dmg, hit: null, color: w.color });
    } else {
      shots.push({ mesh: m, v, life: 1.4, dmg, slow: !!w.slow, color: w.color, pierce: S.pierce && w.pierceable ? 1 : 0, hit: new Set() });
    }
  }
}

function hurt(e, dmg, slow, bypassShield = false) {
  if (e.dead) return;
  if (e.shielded) { burst(e.mesh.position, 0xbfe0ff, 4); sfx("shield_block"); return; } // Gölge Kral Faz 3 kalkanı
  if (e.shield > 0 && !bypassShield) { e.shield = 0; burst(e.mesh.position, 0x6bff9a, 6); sfx("shield_block"); return; }
  e.hp -= dmg;
  if (e.type === "boss" && e.bp < 3) e.hp = Math.max(e.hp, e.maxHp * (e.bp === 1 ? 0.66 : 0.33) - 0.001); // faz atlanmasın
  if (slow) e.slow = 3;
  burst(e.mesh.position, e.d.emissive === 0 ? 0xffffff : e.d.color, 5);
  e.flash = 0.1; // vuruş geri bildirimi: beyaz parlama + hafif geri itme
  if (!e.d.static && e.type !== "boss" && e.type !== "knight") {
    const dx = e.mesh.position.x - wizard.position.x, dz = e.mesh.position.z - wizard.position.z, l = Math.hypot(dx, dz) || 1;
    e.kx = (dx / l) * 3; e.kz = (dz / l) * 3;
  }
  sfx("hit");
  if (e.hp <= 0) killEnemy(e);
}

function explodeEmber(e) {
  e.exploded = true;
  const p = e.mesh.position;
  addFx(p.x, p.z, 0xff7a2a, 0.4, 2.5, 0.35);
  burst(p, 0xff9a3a, 24);
  sfx("explode");
  shake = Math.max(shake, 0.25);
  if (invuln <= 0 && flatDist(p, wizard.position) < 2.5) damagePlayer(1);
  for (const o of [...enemies]) if (o !== e && !o.dead && flatDist(o.mesh.position, p) < 2.5) hurt(o, 1, false);
}

function killEnemy(e) {
  if (e.dead) return;
  const i = enemies.indexOf(e);
  if (i < 0) return;
  e.dead = true;
  enemies.splice(i, 1);
  scene.remove(e.mesh);
  if (e.blob) scene.remove(e.blob);
  disposeEnemy(e);
  burst(e.mesh.position, e.d.color, 14);
  if (e.type === "boss" || e.type === "knight") { shake = Math.max(shake, 0.6); burst(e.mesh.position, 0xffffff, 30); }
  sfx("kill:" + e.type);
  if (e.type === "ember" && !e.exploded) explodeEmber(e);
  if (e.type === "priest") for (const o of enemies) if (flatDist(o.mesh.position, e.mesh.position) < 8) o.shield = 0;
  if (!e.suicide) {
    S.score += e.d.score;
    if (!e.d.static) {
      S.kills++;
      if (S.vampire && S.kills % 12 === 0 && S.hp < S.maxHp) { S.hp = Math.min(S.hp + 1, S.maxHp); burst(wizard.position.clone().setY(1.5), 0xff3b5c, 8); }
    }
    if (Math.random() < e.d.drop) placePickup("heart", e.mesh.position.clone().setY(0.9));
  }
  if (e.type === "totem") {
    totemsDown++;
    burst(e.mesh.position, 0xa8ffe8, 24); // Pırıl'a ışık patlaması
    sfx("totem_down");
    if (totemsDown >= LEVELS[S.level].goal) levelClear();
  }
  if (e.type === "boss" || e.type === "knight") { bossRef = null; levelClear(); }
}

function damagePlayer(n) {
  if (!running) return;
  if (shieldT > 0) {
    shieldT = 0;
    invuln = 0.6;
    burst(wizard.position.clone().setY(1.2), 0x5ab4ff, 16);
    sfx("shield_break");
    shake = Math.max(shake, 0.2);
    return;
  }
  if (stoneReady) { n *= 0.5; stoneReady = false; }
  S.hp -= n;
  invuln = 1.5;
  burst(wizard.position.clone().setY(1.2), 0xff4d6d);
  sfx("hurt");
  shake = Math.max(shake, 0.45);
  flashHurt();
  if (S.hp <= 0) { renderHud(); gameOver(); }
}

function useAbility(id) {
  if (!running || !S.abilities.includes(id) || abilCd[id] > 0) return;
  const a = ABILITIES[id];
  abilCd[id] = a.cd;
  sfx("ability:" + id);
  if (id === "shield") {
    shieldT = 8;
  } else if (id === "blink") {
    const d = moveDir.clone().setY(0).normalize();
    const from = wizard.position.clone();
    for (let i = 0; i <= 6; i++) burst(from.clone().addScaledVector(d, (5 * i) / 6).setY(1), 0x9ad7ff, 3);
    wizard.position.addScaledVector(d, 5);
    wizard.position.x = THREE.MathUtils.clamp(wizard.position.x, -ARENA + 0.5, ARENA - 0.5);
    wizard.position.z = THREE.MathUtils.clamp(wizard.position.z, -ARENA + 0.5, ARENA - 0.5);
    invuln = Math.max(invuln, 0.4);
  } else if (id === "timeslow") {
    timeslowT = 3;
  }
}

// ---------- Arayüz / akış ----------
const textCache = new Map();
function setText(id, text, html) {
  const key = (html ? "h:" : "t:") + text;
  if (textCache.get(id) === key) return;
  textCache.set(id, key);
  if (html) $(id).innerHTML = text; else $(id).textContent = text;
}

function goalText(L) {
  switch (L.objective) {
    case "crystal": return `Mana: ${collected}/${L.goal}`;
    case "survive": return "Hedef: Hayatta kal";
    case "totem": return `Totem: ${totemsDown}/${L.goal}`;
    case "miniboss": return "Hedef: Kemik Şövalye";
    default: return `Hedef: Gölge Kral${bossRef && bossRef.bp ? " · Faz " + bossRef.bp : ""}`;
  }
}

function renderHud() {
  const L = LEVELS[S.level];
  setText("level", `Bölüm ${S.level + 1}/${LEVELS.length}`);
  setText("goal", goalText(L));
  const full = Math.max(Math.floor(S.hp + 1e-6), 0), frac = S.hp > 0 && S.hp - full > 1e-6 ? 1 : 0;
  setText("hearts", "♥".repeat(full) + (frac ? `<span class="half">♥</span>` : "") + "♡".repeat(Math.max(S.maxHp - full - frac, 0)), true);
  setText("time", `Süre: ${Math.ceil(timeLeft)}`);
  setText("score", `Puan: ${S.score}`);
  let b = "";
  if (bossRef) {
    const name = bossRef.type === "knight" ? "Şövalye" : "Kral";
    b = `${name}: ${"█".repeat(Math.max(Math.ceil((bossRef.hp / bossRef.maxHp) * 15), 0))}${bossRef.shielded ? " 🛡" : ""}`;
  }
  setText("boss", b);
}

function screen(title, html, buttons) {
  running = false;
  document.body.classList.remove("playing", "slowtime");
  fireHeld = false;
  $("toast").classList.remove("show");
  $("title").textContent = title;
  $("sub").innerHTML = html;
  const box = $("btns");
  box.innerHTML = "";
  for (const b of buttons) {
    const el = document.createElement("button");
    el.className = "gbtn";
    el.innerHTML = b.label;
    el.onclick = () => { sfx("click"); b.fn(); };
    box.appendChild(el);
  }
  mus.set("menu");
  $("msg").hidden = false;
}

function objectiveHtml(L) {
  switch (L.objective) {
    case "crystal": return `${L.goal} mana kristali topla.`;
    case "survive": return `${L.goal} saniye hayatta kal.`;
    case "totem": return `${L.goal} Lanet Totemi'ni yık.`;
    case "miniboss": return "Kemik Şövalye'yi yen!";
    default: return "Gölge Kral'ı yen!";
  }
}

function introLevel() {
  const L = LEVELS[S.level];
  snapshot = JSON.parse(JSON.stringify(S));
  clearWorld();
  applyTheme(L.theme);
  wizard.position.set(0, 0, 0);
  const types = new Set(Object.keys(L.start));
  L.spawn.forEach((w) => Object.keys(w).forEach((k) => types.add(k)));
  if (L.objective === "totem") types.add("totem");
  const foes = [...types].map((k) => ENEMY_NAMES[k]).join(", ");
  screen(`Bölüm ${S.level + 1}: ${L.name}`, `<i>${saidLines(L.intro)}</i><br><br>${objectiveHtml(L)}<br>Düşmanlar: <b>${esc(foes)}</b><br>Süre: ${L.time} sn · Can: ${Math.ceil(S.hp)}/${S.maxHp}<br><small>Düşenlerden kalp çıkabilir. Yeni büyü ve yetenekler bölüm sonunda açılır.</small>`, [
    { label: "Savaşa gir", fn: startLevel },
  ]);
  renderHud();
  renderWeapons();
  renderAbilities();
}

function startLevel() {
  const L = LEVELS[S.level];
  clearWorld();
  collected = 0; totemsDown = 0; timeLeft = L.time; cooldown = 0; invuln = 1; spawnTimer = 0; bossSummon = 5;
  abilCd.shield = abilCd.blink = abilCd.timeslow = 0;
  stoneReady = false;
  if (S.stoneLevels > 0) { S.stoneLevels--; stoneReady = true; }
  wizard.position.set(0, 0, 0);
  const crystals = L.crystals !== undefined ? L.crystals : (L.objective === "crystal" ? 5 : 0);
  for (let i = 0; i < crystals; i++) spawnCrystal();
  for (const [type, n] of Object.entries(L.start)) for (let i = 0; i < n; i++) spawnEnemy(type);
  if (L.objective === "totem") for (const [x, z] of L.totems) spawnEnemy("totem", { x, z });
  setWandColor(WEAPONS[S.weapon].color);
  mus.set(L.objective === "boss" ? "boss" : "play", L.theme);
  $("msg").hidden = true;
  document.body.classList.add("playing");
  running = true;
  renderHud();
  renderWeapons();
  renderAbilities();
}

function gameOver() {
  if (!running) return;
  running = false;
  sfx("game_over");
  const line = DEATH_LINES[Math.floor(Math.random() * DEATH_LINES.length)];
  const m = /^(Zerrin|Pırıl):\s*(.*)$/.exec(line);
  screen(m ? "Zerrin: " + m[2] : line, `Bölüm ${S.level + 1} · Puan: ${S.score}`, [
    { label: "Bu bölümü tekrar dene<small>Açılan büyüler ve yetenekler korunur</small>", fn: () => { Object.assign(S, JSON.parse(JSON.stringify(snapshot)), {}); S.hp = S.maxHp; introLevel(); } },
    { label: "Baştan başla", fn: () => { newRun(); introLevel(); } },
  ]);
}

function pickPerks() {
  const pool = PERKS.filter((p) => p.id !== S.lastPerk && (!p.ok || p.ok()));
  return pool.sort(() => Math.random() - 0.5).slice(0, 3);
}

function levelClear() {
  if (!running) return;
  const L = LEVELS[S.level];
  running = false;
  sfx("level_clear");
  const bonus = Math.ceil(timeLeft) * 2;
  S.score += bonus + 100 * (S.level + 1);
  renderHud();
  if (S.level === LEVELS.length - 1) {
    screen("Şafak doğdu!", `<i>${saidLines(L.outro)}</i><br><br>Gölge Kral yenildi. Lanet kalktı.<br>Toplam puan: <b>${S.score}</b>`, [
      { label: "Yeniden oyna", fn: () => { newRun(); introLevel(); } },
    ]);
    return;
  }
  let rewardText = "";
  if (L.reward && !S.unlocked.includes(L.reward)) {
    S.unlocked.push(L.reward);
    rewardText += `<br>Yeni büyü: <b>${WEAPONS[L.reward].name}</b> (${WEAPONS[L.reward].key} tuşu)`;
  }
  if (L.ability && !S.abilities.includes(L.ability)) {
    S.abilities.push(L.ability);
    rewardText += `<br>Yeni yetenek: <b>${ABILITIES[L.ability].name}</b> (${ABILITIES[L.ability].key} tuşu / düğme)`;
  }
  if (S.hp < S.maxHp) S.hp = Math.min(S.hp + 1, S.maxHp);
  const choices = pickPerks();
  screen(`Bölüm ${S.level + 1} tamam!`, `<i>${saidLines(L.outro)}</i><br><br>Süre bonusu: +${bonus}${rewardText}<br>Bir yetenek seç:`, choices.map((p) => ({
    label: `${esc(p.name)}<small>${esc(p.desc)}</small>`,
    fn: () => { p.apply(); S.perkCount[p.id] = (S.perkCount[p.id] || 0) + 1; S.lastPerk = p.id; S.level++; introLevel(); },
  })));
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  camK = camera.aspect < 1 ? Math.min(1.6, 0.9 / camera.aspect) : 1;
  scene.fog.density = baseFog / camK;
}
addEventListener("resize", resize);
resize();

// ---------- Düşman yapay zekâsı ----------
const UP = new THREE.Vector3(0, 1, 0);

function enemyShoot(e, ux, uz) {
  const m = makeShot(0xbfd8ff, "");
  m.scale.setScalar(0.8);
  m.position.copy(e.mesh.position);
  scene.add(m);
  enemyShots.push({ mesh: m, vx: ux * 7, vz: uz * 7, life: 4 });
  sfx("enemy_shot");
}

function priestSupport(e) {
  const near = enemies.filter((o) => o !== e && !o.dead && !o.d.static && o.type !== "boss" && o.type !== "knight")
    .sort((a, b) => flatDist(a.mesh.position, e.mesh.position) - flatDist(b.mesh.position, e.mesh.position)).slice(0, 3);
  let weakest = null;
  for (const o of near) {
    o.shield = 6;
    addBolt(e.mesh.position, o.mesh.position, 0x6bff9a);
    if (o.hp < o.maxHp && (!weakest || o.hp < weakest.hp)) weakest = o;
  }
  if (weakest) weakest.hp = Math.min(weakest.hp + 1, weakest.maxHp);
}

function enterBossPhase(e, ph) {
  e.bp = ph;
  timeLeft += 10;
  sfx("phase:" + ph);
  if (ph === 2) {
    e.waveT = 3; bossSummon = 2;
    toast("Faz 2 · Gölge Dalgası — yerdeki kırmızı halkalardan kaç! (+10 sn)");
  } else {
    e.shielded = true; e.vuln = 0;
    spawnLights();
    toast("Faz 3 · Kızın Işığı — Pırıl'ın 3 ışık kristalini topla; kalkan kırılınca vur! (+10 sn)", 5000);
  }
}

function bossLogic(e, dt, es) {
  const ratio = e.hp / e.maxHp;
  const ph = ratio > 0.66 ? 1 : ratio > 0.33 ? 2 : 3;
  if (ph > e.bp) enterBossPhase(e, ph);
  const edt = dt * es;
  if (e.bp === 1) {
    bossSummon -= edt;
    if (bossSummon <= 0) { bossSummon = 6; spawnEnemy("ghost"); spawnEnemy("ghost"); }
  } else if (e.bp === 2) {
    bossSummon -= edt;
    if (bossSummon <= 0) {
      bossSummon = 6;
      if (liveCount() < LEVELS[S.level].cap) spawnEnemy("archer");
      if (liveCount() < LEVELS[S.level].cap) spawnEnemy("bat");
    }
    e.waveT -= edt;
    if (e.waveT <= 0) {
      e.waveT = 8;
      addHazard(wizard.position.x, wizard.position.z, 2.6, 1.2, 1, 0xff3355);
      addHazard(THREE.MathUtils.clamp(wizard.position.x + rand(7), -ARENA, ARENA), THREE.MathUtils.clamp(wizard.position.z + rand(7), -ARENA, ARENA), 2.6, 1.2, 1, 0xff3355);
    }
  } else if (e.shielded) {
    if (!pickups.some((p) => p.type === "light")) { // 3 ışık toplandı: kalkan kırılır
      e.shielded = false; e.vuln = 6; e.spd *= 1.1;
      burst(e.mesh.position, 0xbfe0ff, 30);
      sfx("boss_shield_break");
      toast("Kalkan kırıldı! Şimdi vur!", 2500);
    }
  } else {
    e.vuln -= dt;
    if (e.vuln <= 0) {
      e.shielded = true;
      spawnLights();
      sfx("boss_shield_up");
      toast("Kalkan geri döndü — Pırıl yeni ışık kristalleri bıraktı.", 2500);
    }
  }
}

function applyLook(e) {
  const slowed = e.slow > 0, fl = e.flash > 0;
  e.mat.color.setHex(fl ? 0xffffff : slowed ? 0x9fdcff : e.fuse > 0 ? 0xffffff : e.d.color);
  e.mat.emissiveIntensity = fl ? 4 : slowed ? 0.2 : 1 + e.glow * 3;
  const k = Math.min(e.age / 0.35, 1), gk = 1 - (1 - k) * (1 - k); // belirme: yumuşak büyüme
  e.mesh.scale.set(e.base.x * gk, e.base.y * e.sq * gk, e.base.z * gk);
  const sh = e.shield > 0 || !!e.shielded;
  setShieldVis(e, sh, e.shielded ? 0xbfe0ff : 0x6bff9a);
  setIce(e, slowed);
}
const turnTo = (cur, target, k) => cur + ((((target - cur + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - Math.PI) * Math.min(1, k);

function updateEnemies(dt, t, es) {
  for (const e of [...enemies]) {
    if (e.dead) continue;
    const d = e.d, p = e.mesh.position;
    e.slow = Math.max(e.slow - dt, 0);
    e.age += dt;
    e.flash = Math.max(e.flash - dt, 0);
    if (e.shield > 0) e.shield = Math.max(e.shield - dt, 0);
    const edt = dt * es * (e.slow > 0 ? 0.35 : 1);
    const dx = wizard.position.x - p.x, dz = wizard.position.z - p.z;
    const dist = Math.hypot(dx, dz) || 0.0001;
    const ux = dx / dist, uz = dz / dist;
    e.glow = 0; e.sq = 1;
    let mx = 0, mz = 0; // hareket (birim/sn)

    switch (d.ai) {
      case "chase": {
        let cx = ux, cz = uz;
        if (d.zig) { const a = Math.sin(t * 5 + e.phase) * 0.9, c = Math.cos(a), s = Math.sin(a); cx = ux * c + uz * s; cz = -ux * s + uz * c; }
        mx = cx * e.spd; mz = cz * e.spd;
        break;
      }
      case "ranged": { // Kemik Okçu: 7-9 birim mesafe tutar, 2.5 sn'de bir atar
        const want = dist > 9 ? 1 : dist < 7 ? -1 : 0;
        mx = ux * e.spd * want; mz = uz * e.spd * want;
        e.cd -= edt;
        if (e.cd < 0.5) e.glow = 1;
        if (e.cd <= 0) { e.cd = 2.5; enemyShoot(e, ux, uz); }
        break;
      }
      case "charge": { // Kurt Ruhu: yaklaş -> çömel -> hücum -> yorgun
        if (e.st === "approach") {
          mx = ux * e.spd; mz = uz * e.spd;
          if (dist < 6) { e.st = "crouch"; e.tm = 0.7; }
        } else if (e.st === "crouch") {
          e.tm -= edt; e.glow = 1; e.sq = 0.6;
          if (e.tm <= 0) { e.st = "charge"; e.tm = 0.6; e.cx = ux; e.cz = uz; }
        } else if (e.st === "charge") {
          mx = e.cx * 10; mz = e.cz * 10;
          e.tm -= edt;
          if (e.tm <= 0) { e.st = "tired"; e.tm = 1; }
        } else {
          mx = ux * e.spd * 0.3; mz = uz * e.spd * 0.3;
          e.tm -= edt;
          if (e.tm <= 0) e.st = "approach";
        }
        break;
      }
      case "bomber": { // Kor Hortlak: yaklaşınca 0.5 sn kızarıp patlar
        if (e.fuse > 0) {
          e.fuse -= edt; e.glow = 1;
          if (e.fuse <= 0) { e.suicide = true; killEnemy(e); continue; }
        } else {
          mx = ux * e.spd; mz = uz * e.spd;
          if (dist < 1.5) { e.fuse = 0.5; sfx("telegraph"); }
        }
        break;
      }
      case "support": { // Karanlık Rahip: uzak durur, 4 sn'de bir kalkan + iyileştirme
        const want = dist < 8 ? -1 : dist > 12 ? 1 : 0;
        mx = ux * e.spd * want; mz = uz * e.spd * want;
        e.cd -= edt;
        if (e.cd <= 0) { e.cd = 4; priestSupport(e); }
        break;
      }
      case "static": { // Lanet Totemi: 12 sn'de bir Ruh doğurur
        e.cd -= edt; e.glow = 0.5 + 0.5 * Math.sin(t * 4);
        if (e.cd <= 0) { e.cd = 12; if (liveCount() < LEVELS[S.level].cap + 3) spawnEnemy("ghost", { x: p.x + rand(1.5), z: p.z + rand(1.5) }); }
        break;
      }
      case "knight": { // Kemik Şövalye: yürür, 5 sn'de bir yere vurur (yarıçap 4 şok), %50 hp'de hızlanır
        if (!e.enraged && e.hp <= e.maxHp * 0.5) { e.enraged = true; e.spd = 1.6; e.cd = 0; toast("Şövalye öfkelendi!", 2000); }
        if (e.wind > 0) {
          e.wind -= edt; e.glow = 1;
        } else {
          mx = ux * e.spd; mz = uz * e.spd;
          e.cd -= edt;
          if (e.cd <= 0) { e.cd = 5; e.wind = 1; addHazard(p.x, p.z, 4, 1, 2, 0xff5544); sfx("slam"); }
        }
        break;
      }
      case "boss": {
        bossLogic(e, dt, es);
        if (!e.shielded) { /* kalkan yokken de yürür */ }
        mx = ux * e.spd; mz = uz * e.spd;
        break;
      }
    }

    p.x = THREE.MathUtils.clamp(p.x + mx * edt + e.kx * dt, -ARENA - 1, ARENA + 1);
    p.z = THREE.MathUtils.clamp(p.z + mz * edt + e.kz * dt, -ARENA - 1, ARENA + 1);
    const kd = Math.exp(-dt * 10); // vuruş geri itmesi hızla söner
    e.kx *= kd; e.kz *= kd;
    p.y = d.y + Math.sin(t * 3 + e.phase) * (d.bob !== undefined ? d.bob : 0.3);
    if (d.ai !== "static") e.mesh.rotation.y = turnTo(e.mesh.rotation.y, Math.atan2(ux, uz), dt * 8); // düşman oyuncuya dönük
    applyLook(e);
    if (e.anim) e.anim(t, e);
    if (e.blob) e.blob.position.set(p.x, 0.04, p.z);

    if (d.dmg > 0 && invuln <= 0 && dist < d.r + 0.5) {
      damagePlayer(d.dmg);
      if (!running) return;
    }
  }
}

// ---------- Döngü ----------
let mouseSeen = false;
addEventListener("mousemove", () => { mouseSeen = true; });
const mouseUsed = () => mouseSeen;
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hit = new THREE.Vector3();
const clock = new THREE.Clock();

function update(dt, t) {
  cooldown -= dt;
  invuln -= dt;
  for (const id of ABILITY_ORDER) abilCd[id] = Math.max(abilCd[id] - dt, 0);
  shieldT = Math.max(shieldT - dt, 0);
  timeslowT = Math.max(timeslowT - dt, 0);
  const es = timeslowT > 0 ? 0.4 : 1; // düşman/mermi zaman ölçeği
  document.body.classList.toggle("slowtime", timeslowT > 0);
  trailTick++;
  { // müzik yoğunluğu: düşman doluluğu, az can, süre sonu
    const cap = Math.max(LEVELS[S.level].cap, 1);
    let inten = Math.min(liveCount() / cap, 1) * 0.9;
    if (S.hp <= 1) inten += 0.2;
    if (timeLeft < 10) inten += 0.2;
    mus.intensity(Math.min(inten, 1));
  }

  for (let i = echoQ.length - 1; i >= 0; i--) {
    echoQ[i].t -= dt;
    if (echoQ[i].t <= 0) { const id = echoQ[i].id; echoQ.splice(i, 1); fireSpell(id); }
  }

  // Hareket
  let dx = (keys.has("KeyD") || keys.has("ArrowRight")) - (keys.has("KeyA") || keys.has("ArrowLeft"));
  let dz = (keys.has("KeyS") || keys.has("ArrowDown")) - (keys.has("KeyW") || keys.has("ArrowUp"));
  if (joy) { dx += joy.dx; dz += joy.dy; }
  const dir = new THREE.Vector3(dx, 0, dz);
  if (dir.lengthSq() > 1) dir.normalize();
  if (dir.lengthSq() > 0.01) moveDir.copy(dir).normalize();
  wizard.position.addScaledVector(dir, BASE_SPEED * S.speedMul * dt);
  wizard.position.x = THREE.MathUtils.clamp(wizard.position.x, -ARENA + 0.5, ARENA - 0.5);
  wizard.position.z = THREE.MathUtils.clamp(wizard.position.z, -ARENA + 0.5, ARENA - 0.5);

  // Nişan: fare yerde nereyi gösteriyorsa; dokunmatikte en yakın düşman / yürüme yönü
  ray.setFromCamera(mouse, camera);
  if (joy || (isTouch && !mouseUsed())) {
    const near = nearestEnemies(wizard.position, 1, 18)[0];
    if (near) { aim.copy(near.mesh.position).sub(wizard.position).setY(0).normalize(); aimPoint.copy(near.mesh.position).setY(0); }
    else {
      if (dir.lengthSq() > 0) aim.copy(dir).normalize();
      aimPoint.copy(wizard.position).addScaledVector(aim, 7);
    }
  } else if (ray.ray.intersectPlane(groundPlane, hit)) {
    aimPoint.copy(hit);
    const d = hit.clone().sub(wizard.position).setY(0);
    if (d.lengthSq() > 0.01) aim.copy(d.normalize());
  }
  if (fireHeld) cast();
  wizard.rotation.y = Math.atan2(aim.x, aim.z);
  wand.position.set(wizard.position.x, 2.2, wizard.position.z);
  wizard.visible = invuln <= 0 || Math.floor(t * 12) % 2 === 0;
  shieldBall.visible = shieldT > 0;
  if (shieldT > 0) shieldBall.position.set(wizard.position.x, 1.2, wizard.position.z);

  updateEnemies(dt, t, es);
  if (!running) return;

  // Oyuncu mermileri
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.mesh.position.addScaledVector(s.v, dt);
    if ((trailTick + i) % 2 === 0) emit(s.mesh.position, s.color, 1, 0.5, 0.25); // iz bırakan kıvılcım
    s.life -= dt;
    let gone = s.life <= 0;
    if (s.cloud) {
      if (gone) addCloud(THREE.MathUtils.clamp(s.mesh.position.x, -ARENA, ARENA), THREE.MathUtils.clamp(s.mesh.position.z, -ARENA, ARENA), s.dmg, s.cloud);
    } else if (!gone) {
      let target = null;
      for (const e of enemies) {
        if (s.hit.has(e)) continue;
        if (flatDist(s.mesh.position, e.mesh.position) < e.d.r + 0.3) { target = e; break; }
      }
      if (target) {
        s.hit.add(target);
        hurt(target, s.dmg, s.slow);
        if (s.pierce > 0 && !target.d.static) s.pierce--; else gone = true;
      }
    }
    if (gone) { scene.remove(s.mesh); shots.splice(i, 1); }
    if (!running) return;
  }

  // Düşman mermileri
  for (let i = enemyShots.length - 1; i >= 0; i--) {
    const s = enemyShots[i];
    s.mesh.position.x += s.vx * dt * es;
    s.mesh.position.z += s.vz * dt * es;
    s.life -= dt * es;
    let gone = s.life <= 0 || Math.abs(s.mesh.position.x) > ARENA + 2 || Math.abs(s.mesh.position.z) > ARENA + 2;
    if (!gone && invuln <= 0 && flatDist(s.mesh.position, wizard.position) < 0.8) { gone = true; damagePlayer(1); }
    if (gone) { scene.remove(s.mesh); enemyShots.splice(i, 1); }
    if (!running) return;
  }

  // Zehir bulutları
  for (let i = clouds.length - 1; i >= 0; i--) {
    const c = clouds[i];
    c.life -= dt; c.tick -= dt;
    c.m.material.opacity = 0.28 * Math.min(1, c.life);
    c.m.scale.set(c.r * (1 + Math.sin(t * 3) * 0.04), 0.9, c.r * (1 + Math.sin(t * 3) * 0.04));
    if (c.tick <= 0) {
      c.tick = 0.5;
      for (const e of [...enemies]) if (!e.dead && flatDist(e.mesh.position, c) < c.r + e.d.r * 0.5) hurt(e, c.dmg * 0.5, false, true); // saniyede 1*dmg
      burst(new THREE.Vector3(c.x + rand(c.r * 0.7), 0.8, c.z + rand(c.r * 0.7)), 0x6bff6b, 2);
    }
    if (c.life <= 0) { scene.remove(c.m); c.m.material.dispose(); clouds.splice(i, 1); }
    if (!running) return;
  }

  // Meteorlar
  for (let i = strikes.length - 1; i >= 0; i--) {
    const s = strikes[i];
    s.t -= dt;
    s.ball.position.y = 0.7 + 13.3 * Math.max(s.t / s.max, 0);
    emit(s.ball.position, 0xffa03a, 2, 1.5, 0.35);
    if (s.t <= 0) {
      scene.remove(s.ball); s.ball.material.dispose(); strikes.splice(i, 1);
      addFx(s.x, s.z, 0xffa03a, 0.5, s.r, 0.3);
      burst(new THREE.Vector3(s.x, 0.8, s.z), 0xffa03a, 30);
      sfx("meteor_hit");
      shake = Math.max(shake, 0.3);
      for (const e of [...enemies]) if (!e.dead && flatDist(e.mesh.position, s) < s.r + e.d.r * 0.5) hurt(e, s.dmg, false);
      if (!running) return;
    }
  }

  // Yer işaretleri (boss dalgası, şövalye şoku, meteor işareti)
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    h.t -= dt * (h.real ? 1 : es);
    h.fill.scale.setScalar(Math.max(h.r * (1 - h.t / h.dur), 0.01));
    if (h.t <= 0) {
      hazards.splice(i, 1);
      if (h.dmg > 0) {
        burst(new THREE.Vector3(h.x, 0.5, h.z), 0xff5566, 18);
        shake = Math.max(shake, 0.25);
        if (invuln <= 0 && flatDist(wizard.position, h) < h.r) damagePlayer(h.dmg);
      }
      dropHazard(h);
      if (!running) return;
    }
  }

  // Toplananlar
  const pr = 1.2 + (S.piril ? 0.5 : 0);
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    const flat = wizard.position.clone().setY(p.mesh.position.y);
    const dist = p.mesh.position.distanceTo(flat);
    if (S.magnet && dist < S.magnet) p.mesh.position.addScaledVector(flat.sub(p.mesh.position).normalize(), 9 * dt);
    if (dist < pr) {
      scene.remove(p.mesh);
      pickups.splice(i, 1);
      sfx("pickup:" + p.type);
      if (p.type === "heart") {
        S.hp = Math.min(S.hp + 1, S.maxHp);
        burst(p.mesh.position, 0xff3b5c, 14);
      } else if (p.type === "light") {
        S.score += 25;
        burst(p.mesh.position, 0xfff6c8, 18);
      } else {
        const L = LEVELS[S.level];
        S.score += 10;
        burst(p.mesh.position, 0x5ee7ff);
        const want = L.crystals !== undefined ? L.crystals : (L.objective === "crystal" ? 5 : 0);
        if (pickups.filter((q) => q.type === "crystal").length < want) spawnCrystal();
        if (L.objective === "crystal") {
          collected++;
          if (S.rain && Math.random() < S.rain) collected++; // Mana Yağmuru
          if (collected >= L.goal) { levelClear(); return; }
        } else if (Math.random() < 0.35) placePickup("heart", p.mesh.position.clone().setY(0.9)); // diğer hedeflerde kristal kalp/mana ödülüdür
      }
    }
  }

  // Yeni düşman doğurma
  const L = LEVELS[S.level];
  if (L.spawn.length) {
    spawnTimer += dt;
    if (spawnTimer > L.every && liveCount() < L.cap) {
      spawnTimer = 0;
      const wave = L.spawn[Math.floor(Math.random() * L.spawn.length)];
      for (const [type, n] of Object.entries(wave)) for (let k = 0; k < n; k++) if (liveCount() < L.cap) spawnEnemy(type);
    }
  }

  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0;
    renderHud();
    if (L.objective === "survive") levelClear(); else gameOver();
    return;
  }
  renderHud();
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  ring.rotation.z += dt * 0.3;
  const focus = wizard.position.clone().multiplyScalar(0.6);
  shake = Math.max(shake - dt * 2.5, 0);
  camera.position.set(focus.x + rand(shake), 17 * camK + rand(shake * 0.5), focus.z + 12 * camK + rand(shake));
  camera.lookAt(focus);
  camera.updateMatrixWorld();
  animateWizard(dt, t);
  updateWeather(dt, t);
  sceneryTick(dt, t);
  wand.intensity = 30 + Math.sin(t * 13) * 3 + Math.random() * 2; // asa ışığı titremesi
  pickups.forEach((p, i) => { p.mesh.position.y = 0.9 + Math.sin(t * 2.5 + i) * 0.2; p.mesh.rotation.y += dt * 1.5; });
  updateSparks(dt);
  for (let i = bolts.length - 1; i >= 0; i--) {
    bolts[i].userData.life -= dt;
    bolts[i].material.opacity = Math.max(bolts[i].userData.life / 0.18, 0);
    if (bolts[i].userData.life <= 0) { removeObj(bolts[i]); bolts.splice(i, 1); }
  }
  for (let i = fxs.length - 1; i >= 0; i--) {
    const f = fxs[i];
    f.t -= dt;
    const k = 1 - Math.max(f.t, 0) / f.life;
    f.m.scale.setScalar(f.r0 + (f.r1 - f.r0) * k);
    f.m.material.opacity = 0.8 * (1 - k);
    if (f.t <= 0) { scene.remove(f.m); f.m.material.dispose(); fxs.splice(i, 1); }
  }

  // Pırıl: ilk bölüm bittikten sonra büyücüyü çevreler
  piril.visible = S.level >= 1;
  animatePiril(dt, t);

  if (running) {
    update(dt, t);
    // Pırıl'ın Işığı: en yakın kristale çizgi
    let g = false;
    if (running && S.piril) {
      let best = null, bd = 1e9;
      for (const p of pickups) if (p.type === "crystal") { const d = flatDist(p.mesh.position, wizard.position); if (d < bd) { bd = d; best = p; } }
      if (best) {
        const a = guideGeo.attributes.position.array;
        a[0] = wizard.position.x; a[1] = 0.3; a[2] = wizard.position.z; a[3] = best.mesh.position.x; a[4] = 0.3; a[5] = best.mesh.position.z;
        guideGeo.attributes.position.needsUpdate = true;
        g = true;
      }
    }
    guide.visible = g;
    updateAbilityUi();
  } else guide.visible = false;
  orbTip.getWorldPosition(_tip); // asa ışığı ve kıvılcımlar asanın ucunda
  wand.position.copy(_tip); wand.position.y += 0.25;
  if (Math.random() < 0.15) emit(_tip, orbTip.material.color.getHex(), 1, 0.8, 0.5);
  renderer.render(scene, camera);
});

// Açılış ekranı
applyTheme(0);
renderWeapons();
screen("Büyücünün Gecesi", `<i>${esc(OPENING)}</i><br><br>${LEVELS.length} lanetli bölümden geç. Mana kristallerini topla, totemleri yık, düşmanları büyüyle durdur, yeni büyüler ve yetenekler kazan.<br>WASD / ok tuşları: yürü · Fare: nişan · Boşluk / tık: büyü · 1-7: büyü seç · Q / E / R: yetenekler<br><small>Mobilde: ekranda parmağını sürükleyerek yürü, sağ alttaki ✦ butonuna basılı tutarak ateş et (nişan otomatik). Alttaki çubuğu kaydırarak büyü değiştir; yetenek düğmeleri ✦'nın üstünde belirir.</small>`, [
  { label: "Büyüyü Başlat", fn: introLevel },
]);
</script>
