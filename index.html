<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Büyücünün Gecesi</title>
<meta name="theme-color" content="#0a0714" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Büyücü" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<link rel="stylesheet" href="./css/game.css" />
</head>
<body>
<div id="hud" aria-label="Oyun durumu"></div>
<div id="weapons" role="toolbar" aria-label="Büyüler"></div>
<div id="abil" role="toolbar" aria-label="Yetenekler"></div>
<div id="joy"><i></i></div>
<button id="fire" aria-label="Büyü yap">✦</button>
<div id="tint"></div>
<div id="haze"></div>
<div id="hurt"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="stage" hidden></div>
<div id="msg" hidden><h1 id="title"></h1><p id="sub"></p><div id="btns"></div></div>
<button id="cam" class="round-btn" aria-label="Kamera açısını değiştir (V)" title="Kamera açısı (V) · Z/C döndür · tekerlek yakınlaştır">📷</button>
<button id="mute" class="round-btn" aria-label="Sesi kapat" title="Sesi kapat">🔊</button>
<!-- file:// ile açılırsa ES modülleri tarayıcıda yüklenmez; bu yüzden uyarı modül değil, bu küçük klasik betikten gelir
     (metin js/config/load.js FILE_PROTOCOL_MESSAGE ile aynı olmalı). -->
<script>
  if (location.protocol === "file:") {
    document.getElementById("msg").hidden = false;
    document.getElementById("title").textContent = "Sunucu gerekli";
    document.getElementById("sub").textContent = "Bu oyun bir sunucudan açılmalı: dosyaya çift tıklamak (file://) tarayıcıda çalışmaz. Proje klasöründe `npx serve . -l 8000` çalıştırıp http://localhost:8000 adresini açın.";
  }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
