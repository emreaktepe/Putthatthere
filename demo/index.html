<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Büyücünün Gecesi — Three.js demo</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.min.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #0a0714; font-family: Georgia, "Times New Roman", serif; color: #f1e6ff; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 26px; font-size: 19px; pointer-events: none; text-shadow: 0 0 8px #8e44ff, 0 2px 6px #000; }
  #hearts { letter-spacing: 3px; color: #ff7a93; }
  #boss { color: #ff9a9a; }
  #weapons { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
  .wbtn { font-family: inherit; font-size: 15px; padding: 8px 14px; border: 1px solid #6b4fb0; border-radius: 8px; background: rgba(30,15,60,.8); color: #cdb8ff; cursor: pointer; }
  .wbtn.active { border-color: #fff; background: #5128a8; color: #fff; box-shadow: 0 0 12px #8e44ff; }
  .wbtn.locked { opacity: .35; cursor: default; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(40,15,80,.82), rgba(5,3,12,.94)); text-align: center; gap: 12px; padding: 0 20px; }
  #msg[hidden] { display: none; }
  #btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  h1 { font-size: 42px; margin: 0; color: #d9b3ff; text-shadow: 0 0 18px #8e44ff; }
  p { margin: 0; max-width: 560px; line-height: 1.5; }
  .gbtn { font-family: inherit; font-size: 17px; padding: 10px 24px; border: 1px solid #d9b3ff; border-radius: 8px; background: #3a1d7a; color: #fff; cursor: pointer; box-shadow: 0 0 14px #8e44ff; }
  .gbtn:hover { background: #5128a8; }
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(217,179,255,.5); background: rgba(80,40,160,.2); pointer-events: none; display: none; }
  #joy i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(217,179,255,.75); box-shadow: 0 0 12px #8e44ff; }
  #fire { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: 74px; width: 92px; height: 92px; border-radius: 50%; border: 2px solid #fff; background: rgba(120,50,220,.6); color: #fff; font-size: 34px; box-shadow: 0 0 18px #8e44ff; display: none; touch-action: none; }
  #fire:active { background: rgba(160,90,255,.85); }
  body.touch #fire { display: block; }
  body.touch.playing #fire { display: block; }
  body:not(.playing) #fire, body:not(.playing) #joy { display: none !important; }
  .wbtn .k { opacity: .7; }
  @media (max-width: 700px), (pointer: coarse) {
    #hud { font-size: 14px; gap: 4px 14px; top: max(6px, env(safe-area-inset-top)); }
    h1 { font-size: 30px; }
    p { font-size: 15px; }
    #msg { overflow-y: auto; justify-content: flex-start; padding-top: 8vh; padding-bottom: 20px; }
    .wbtn { font-size: 20px; padding: 8px 12px; }
    .wbtn .wn, .wbtn .k { display: none; }
    #weapons { bottom: max(12px, env(safe-area-inset-bottom)); }
    .gbtn { font-size: 16px; padding: 12px 18px; }
  }
  .gbtn small { display: block; font-size: 13px; color: #cdb8ff; margin-top: 3px; }
</style>
</head>
<body>
<div id="hud">
  <span id="level"></span><span id="goal"></span><span id="hearts"></span><span id="time"></span><span id="score"></span><span id="boss"></span>
</div>
<div id="weapons"></div>
<div id="joy"><i></i></div>
<button id="fire" aria-label="Büyü yap">✦</button>
<div id="msg"><h1 id="title"></h1><p id="sub"></p><div id="btns"></div></div>
<script type="module">
import * as THREE from "three";

const ARENA = 14;
const BASE_SPEED = 8;
const START_HP = 3;

const $ = (id) => document.getElementById(id);
const rand = (r) => (Math.random() * 2 - 1) * r;
const mat = (o) => new THREE.MeshStandardMaterial(o);

// ---------- Veri: bölümler, silahlar, düşmanlar, yetenekler ----------
const LEVELS = [
  { name: "Fısıldayan Orman", goal: 6, time: 50, start: { ghost: 3 }, spawn: { ghost: 1 }, every: 8, cap: 5, reward: "frost" },
  { name: "Yarasa Mağarası", goal: 8, time: 55, start: { ghost: 2, bat: 3 }, spawn: { bat: 1, ghost: 1 }, every: 7, cap: 7, reward: "arcane" },
  { name: "Taş Bekçiler", goal: 10, time: 60, start: { ghost: 2, bat: 2, golem: 2 }, spawn: { golem: 1, bat: 1 }, every: 7, cap: 8, reward: "lightning" },
  { name: "Hortlak Geçidi", goal: 12, time: 65, start: { ghost: 3, bat: 3, golem: 3 }, spawn: { ghost: 1, bat: 1, golem: 1 }, every: 6, cap: 10, reward: null },
  { name: "Gölge Kral", goal: 0, time: 100, start: { boss: 1 }, spawn: { ghost: 1, bat: 1 }, every: 6, cap: 7, reward: null, boss: true },
];

const WEAPONS = {
  fire: { name: "Ateş Topu", icon: "🔥", key: "1", color: 0xffa03a, cd: 0.35, dmg: 1, speed: 16 },
  frost: { name: "Buz Oku", icon: "❄️", key: "2", color: 0x7fd6ff, cd: 0.5, dmg: 1, speed: 15, slow: true },
  arcane: { name: "Üçlü Büyü", icon: "✨", key: "3", color: 0xd27bff, cd: 0.65, dmg: 1, speed: 15, spread: 3 },
  lightning: { name: "Yıldırım", icon: "⚡", key: "4", color: 0xfff27a, cd: 0.9, dmg: 2, chain: 3, range: 13 },
};
const WEAPON_ORDER = ["fire", "frost", "arcane", "lightning"];

const ENEMIES = {
  ghost: { hp: 1, speed: 2.2, r: 0.7, y: 1.2, score: 20, drop: 0.12, color: 0xc9ffd9, emissive: 0x2f9e5a, dmg: 1 },
  bat: { hp: 1, speed: 4.6, r: 0.5, y: 1.6, score: 25, drop: 0.12, color: 0xb98bff, emissive: 0x5a2fa0, dmg: 1, zig: true },
  golem: { hp: 4, speed: 1.3, r: 1.2, y: 1.2, score: 60, drop: 0.4, color: 0x8a8a96, emissive: 0x2a2a35, dmg: 1 },
  boss: { hp: 30, speed: 1.5, r: 2.2, y: 2.4, score: 500, drop: 0, color: 0xff5a6e, emissive: 0x8a1030, dmg: 2 },
};

const PERKS = [
  { id: "hp", name: "Yaşam Özü", desc: "Azami can +1 ve 1 can yenilenir", apply: () => { S.maxHp++; S.hp = Math.min(S.hp + 1, S.maxHp); } },
  { id: "speed", name: "Rüzgâr Ayakkabıları", desc: "Hareket hızı +15%", apply: () => { S.speedMul *= 1.15; } },
  { id: "power", name: "Güç Tılsımı", desc: "Tüm büyülerin hasarı +25%", apply: () => { S.dmgMul *= 1.25; } },
  { id: "haste", name: "Hızlı Parmaklar", desc: "Büyü bekleme süresi -20%", apply: () => { S.cdMul *= 0.8; } },
  { id: "magnet", name: "Mana Mıknatısı", desc: "Kristaller ve kalpler sana çekilir", apply: () => { S.magnet += 3.5; } },
];

// ---------- Oyun durumu ----------
const S = {};
let snapshot = null;
function newRun() {
  Object.assign(S, { level: 0, hp: START_HP, maxHp: START_HP, speedMul: 1, dmgMul: 1, cdMul: 1, magnet: 0, unlocked: ["fire"], weapon: "fire", score: 0 });
}
newRun();

let collected = 0, timeLeft = 0, running = false, cooldown = 0, invuln = 0, spawnTimer = 0, bossSummon = 0, bossRef = null;

// ---------- Sahne ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0714);
scene.fog = new THREE.FogExp2(0x0a0714, 0.035);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
camera.position.set(0, 17, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);

const hemi = new THREE.HemisphereLight(0x6a5acd, 0x120a24, 0.9);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0xb9c7ff, 1.4);
moon.position.set(-8, 14, 6);
moon.castShadow = true;
Object.assign(moon.shadow.camera, { left: -ARENA, right: ARENA, top: ARENA, bottom: -ARENA });
scene.add(moon);

const wand = new THREE.PointLight(0xc58cff, 40, 12);
scene.add(wand);

const floorMat = mat({ color: 0x1a1030, roughness: 1 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2, ARENA * 2), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ring = new THREE.Mesh(new THREE.RingGeometry(3.2, 3.5, 48), new THREE.MeshBasicMaterial({ color: 0x8e44ff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.02;
scene.add(ring);

scene.add(new THREE.Points(
  new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(
    Array.from({ length: 600 }, () => rand(40)).map((v, i) => (i % 3 === 1 ? 10 + Math.abs(v) : v)), 3)),
  new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 })
));

// Bölüme göre renk teması
const THEMES = [
  { bg: 0x0a0714, floor: 0x1a1030, ring: 0x8e44ff },
  { bg: 0x08101a, floor: 0x14202e, ring: 0x44a0ff },
  { bg: 0x140c08, floor: 0x2a1c14, ring: 0xffa044 },
  { bg: 0x0a1410, floor: 0x142a20, ring: 0x44ff9a },
  { bg: 0x1a0508, floor: 0x2e1018, ring: 0xff4466 },
];
function applyTheme(i) {
  const t = THEMES[i];
  scene.background.setHex(t.bg);
  scene.fog.color.setHex(t.bg);
  floorMat.color.setHex(t.floor);
  ring.material.color.setHex(t.ring);
}

const trunkGeo = new THREE.CylinderGeometry(0.25, 0.4, 2, 6);
const crownGeo = new THREE.ConeGeometry(1.4, 4, 7);
for (let i = 0; i < 28; i++) {
  const a = (i / 28) * Math.PI * 2;
  const r = ARENA + 1 + Math.random() * 2;
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(trunkGeo, mat({ color: 0x2b1a12 }));
  trunk.position.y = 1;
  const crown = new THREE.Mesh(crownGeo, mat({ color: 0x143a2a }));
  crown.position.y = 3.5;
  trunk.castShadow = crown.castShadow = true;
  g.add(trunk, crown);
  g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  g.scale.setScalar(0.8 + Math.random() * 0.8);
  scene.add(g);
}

// ---------- Büyücü ----------
const wizard = new THREE.Group();
const robe = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.6, 10), mat({ color: 0x4b2a9c }));
robe.position.y = 0.8;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), mat({ color: 0xf2c9a0 }));
head.position.y = 1.7;
const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 0.06, 20), mat({ color: 0x2a1566 }));
brim.position.y = 1.9;
const hat = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.1, 14), mat({ color: 0x2a1566 }));
hat.position.y = 2.45;
hat.rotation.z = 0.15;
const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2, 6), mat({ color: 0x6b4423 }));
staff.position.set(0.6, 1, 0.2);
const orbTip = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), new THREE.MeshBasicMaterial({ color: 0xe0b3ff }));
orbTip.position.set(0.6, 2.05, 0.2);
wizard.add(robe, head, brim, hat, staff, orbTip);
wizard.traverse((n) => { if (n.isMesh) n.castShadow = true; });
scene.add(wizard);

// ---------- Nesneler ----------
const crystalGeo = new THREE.OctahedronGeometry(0.5);
const crystalMat = mat({ color: 0x5ee7ff, emissive: 0x1b9ec2, emissiveIntensity: 1.2, roughness: 0.2 });
const heartGeo = new THREE.IcosahedronGeometry(0.45);
const heartMat = mat({ color: 0xff3b5c, emissive: 0xa00828, emissiveIntensity: 1.3, roughness: 0.3 });
const enemyGeos = {
  ghost: new THREE.SphereGeometry(1, 16, 12),
  bat: new THREE.ConeGeometry(0.8, 1.2, 5),
  golem: new THREE.BoxGeometry(1, 1, 1),
  boss: new THREE.IcosahedronGeometry(1, 1),
};
const projGeo = new THREE.SphereGeometry(0.25, 12, 10);

const pickups = []; // { mesh, type: "crystal" | "heart" }
const enemies = [];
const shots = [];
const sparks = [];
const bolts = [];

function placePickup(type, pos) {
  const m = new THREE.Mesh(type === "heart" ? heartGeo : crystalGeo, type === "heart" ? heartMat : crystalMat);
  m.position.copy(pos);
  m.castShadow = true;
  scene.add(m);
  pickups.push({ mesh: m, type });
}
const spawnCrystal = () => placePickup("crystal", new THREE.Vector3(rand(ARENA - 1.5), 0.9, rand(ARENA - 1.5)));

function spawnEnemy(type) {
  const d = ENEMIES[type];
  const m = new THREE.Mesh(enemyGeos[type], new THREE.MeshStandardMaterial({
    color: d.color, emissive: d.emissive, transparent: type === "ghost", opacity: type === "ghost" ? 0.75 : 1, roughness: 0.6,
  }));
  m.scale.setScalar(d.r);
  if (type === "bat") m.scale.set(d.r * 1.4, d.r * 0.5, d.r * 1.4);
  const a = Math.random() * Math.PI * 2;
  m.position.set(Math.cos(a) * ARENA, d.y, Math.sin(a) * ARENA);
  m.castShadow = true;
  scene.add(m);
  const e = { mesh: m, type, d, hp: d.hp, slow: 0, phase: Math.random() * 10 };
  enemies.push(e);
  if (type === "boss") bossRef = e;
  return e;
}

function burst(pos, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), new THREE.MeshBasicMaterial({ color, transparent: true }));
    s.position.copy(pos);
    s.userData = { v: new THREE.Vector3(rand(4), Math.random() * 4, rand(4)), life: 0.6 };
    scene.add(s);
    sparks.push(s);
  }
}

function clearWorld() {
  [...pickups.map((p) => p.mesh), ...enemies.map((e) => e.mesh), ...shots.map((s) => s.mesh), ...sparks, ...bolts].forEach((m) => scene.remove(m));
  pickups.length = enemies.length = shots.length = sparks.length = bolts.length = 0;
  bossRef = null;
}

// ---------- Girdi ----------
const keys = new Set();
const aim = new THREE.Vector3(0, 0, -1);
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let joy = null; // { id, x, y, dx, dy }
let fireHeld = false;
const joyEl = $("joy"), fireEl = $("fire");
const isTouch = matchMedia("(pointer: coarse)").matches;
if (isTouch) document.body.classList.add("touch");
addEventListener("contextmenu", (e) => e.preventDefault());
addEventListener("keydown", (e) => {
  keys.add(e.code);
  if (e.code === "Space") { e.preventDefault(); cast(); }
  const idx = ["Digit1", "Digit2", "Digit3", "Digit4"].indexOf(e.code);
  if (idx >= 0) selectWeapon(WEAPON_ORDER[idx]);
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("pointermove", (e) => {
  if (e.pointerType !== "touch") mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (joy && e.pointerId === joy.id) {
    const R = 50;
    let dx = e.clientX - joy.x, dy = e.clientY - joy.y;
    const len = Math.hypot(dx, dy);
    if (len > R) { dx = (dx / len) * R; dy = (dy / len) * R; }
    joy.dx = dx / R; joy.dy = dy / R;
    joyEl.firstElementChild.style.transform = `translate(${dx}px, ${dy}px)`;
  }
});
addEventListener("pointerdown", (e) => {
  if (e.target.closest("button")) return;
  if (e.pointerType === "touch") {
    document.body.classList.add("touch");
    if (!joy) {
      joy = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
      joyEl.style.left = e.clientX + "px";
      joyEl.style.top = e.clientY + "px";
      joyEl.style.display = "block";
      joyEl.firstElementChild.style.transform = "";
    }
  } else cast();
});
function endPointer(e) {
  if (joy && e.pointerId === joy.id) { joy = null; joyEl.style.display = "none"; }
}
addEventListener("pointerup", endPointer);
addEventListener("pointercancel", endPointer);
fireEl.addEventListener("pointerdown", (e) => { e.preventDefault(); fireHeld = true; fireEl.setPointerCapture(e.pointerId); cast(); });
const stopFire = () => { fireHeld = false; };
fireEl.addEventListener("pointerup", stopFire);
fireEl.addEventListener("pointercancel", stopFire);

function selectWeapon(id) {
  if (!S.unlocked.includes(id)) return;
  S.weapon = id;
  orbTip.material.color.setHex(WEAPONS[id].color);
  renderWeapons();
}

function renderWeapons() {
  const bar = $("weapons");
  bar.innerHTML = "";
  for (const id of WEAPON_ORDER) {
    const w = WEAPONS[id];
    const b = document.createElement("button");
    const open = S.unlocked.includes(id);
    b.className = "wbtn" + (id === S.weapon ? " active" : "") + (open ? "" : " locked");
    b.innerHTML = open ? `${w.icon} <span class="k">${w.key} ·</span> <span class="wn">${w.name}</span>` : `🔒`;
    b.onclick = () => selectWeapon(id);
    bar.appendChild(b);
  }
}

// ---------- Savaş ----------
function nearestEnemies(from, n, range) {
  return enemies
    .map((e) => ({ e, d: e.mesh.position.distanceTo(from) }))
    .filter((x) => x.d <= range)
    .sort((a, b) => a.d - b.d)
    .slice(0, n)
    .map((x) => x.e);
}

function cast() {
  if (!running || cooldown > 0) return;
  const w = WEAPONS[S.weapon];
  cooldown = w.cd * S.cdMul;
  const origin = wizard.position.clone().setY(1.7);
  const dmg = w.dmg * S.dmgMul;

  if (w.chain) {
    let prev = origin;
    for (const e of nearestEnemies(origin, w.chain, w.range)) {
      const to = e.mesh.position.clone();
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([prev.clone(), to]), new THREE.LineBasicMaterial({ color: w.color, transparent: true }));
      line.userData.life = 0.18;
      scene.add(line);
      bolts.push(line);
      hurt(e, dmg, false);
      prev = to;
    }
    if (prev === origin) { // hedef yoksa ileri doğru kısa şimşek
      const to = origin.clone().addScaledVector(aim, 6);
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([origin, to]), new THREE.LineBasicMaterial({ color: w.color, transparent: true }));
      line.userData.life = 0.18;
      scene.add(line);
      bolts.push(line);
    }
    return;
  }

  const n = w.spread || 1;
  for (let i = 0; i < n; i++) {
    const ang = n === 1 ? 0 : (i - (n - 1) / 2) * 0.28;
    const v = aim.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), ang).multiplyScalar(w.speed);
    const m = new THREE.Mesh(projGeo, new THREE.MeshBasicMaterial({ color: w.color }));
    m.position.copy(origin);
    scene.add(m);
    shots.push({ mesh: m, v, life: 1.4, dmg, slow: !!w.slow, color: w.color });
  }
}

function hurt(e, dmg, slow) {
  e.hp -= dmg;
  if (slow) e.slow = 3;
  burst(e.mesh.position, e.d.emissive === 0 ? 0xffffff : e.d.color, 5);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  const i = enemies.indexOf(e);
  if (i < 0) return;
  enemies.splice(i, 1);
  scene.remove(e.mesh);
  burst(e.mesh.position, e.d.color, 14);
  S.score += e.d.score;
  if (Math.random() < e.d.drop) placePickup("heart", e.mesh.position.clone().setY(0.9));
  if (e.type === "boss") { bossRef = null; levelClear(); }
}

function damagePlayer(n) {
  S.hp -= n;
  invuln = 1.5;
  burst(wizard.position.clone().setY(1.2), 0xff4d6d);
  if (S.hp <= 0) { renderHud(); gameOver(); }
}

// ---------- Arayüz / akış ----------
function renderHud() {
  const L = LEVELS[S.level];
  $("level").textContent = `Bölüm ${S.level + 1}/${LEVELS.length}`;
  $("goal").textContent = L.boss ? "Hedef: Gölge Kral" : `Mana: ${collected}/${L.goal}`;
  $("hearts").textContent = "♥".repeat(Math.max(S.hp, 0)) + "♡".repeat(Math.max(S.maxHp - S.hp, 0));
  $("time").textContent = `Süre: ${Math.ceil(timeLeft)}`;
  $("score").textContent = `Puan: ${S.score}`;
  $("boss").textContent = bossRef ? `Kral: ${"█".repeat(Math.ceil(bossRef.hp / 2))}` : "";
}

function screen(title, html, buttons) {
  running = false;
  document.body.classList.remove("playing");
  fireHeld = false;
  $("title").textContent = title;
  $("sub").innerHTML = html;
  const box = $("btns");
  box.innerHTML = "";
  for (const b of buttons) {
    const el = document.createElement("button");
    el.className = "gbtn";
    el.innerHTML = b.label;
    el.onclick = b.fn;
    box.appendChild(el);
  }
  $("msg").hidden = false;
}

const ENEMY_NAMES = { ghost: "Ruh", bat: "Yarasa", golem: "Taş Bekçi", boss: "Gölge Kral" };

function introLevel() {
  const L = LEVELS[S.level];
  snapshot = JSON.parse(JSON.stringify(S));
  clearWorld();
  applyTheme(S.level);
  wizard.position.set(0, 0, 0);
  const foes = Object.keys(L.start).map((k) => ENEMY_NAMES[k]).join(", ");
  const goal = L.boss ? "Gölge Kral'ı yen!" : `${L.goal} mana kristali topla.`;
  screen(`Bölüm ${S.level + 1}: ${L.name}`, `${goal}<br>Düşmanlar: <b>${foes}</b><br>Süre: ${L.time} sn · Can: ${S.hp}/${S.maxHp}<br><small>Düşenlerden kalp çıkabilir. Yıldırım ve diğer büyüler bölüm sonunda açılır.</small>`, [
    { label: "Savaşa gir", fn: startLevel },
  ]);
  renderHud();
  renderWeapons();
}

function startLevel() {
  const L = LEVELS[S.level];
  clearWorld();
  collected = 0; timeLeft = L.time; cooldown = 0; invuln = 1; spawnTimer = 0; bossSummon = 5;
  wizard.position.set(0, 0, 0);
  for (let i = 0; i < 5; i++) spawnCrystal();
  for (const [type, n] of Object.entries(L.start)) for (let i = 0; i < n; i++) spawnEnemy(type);
  orbTip.material.color.setHex(WEAPONS[S.weapon].color);
  $("msg").hidden = true;
  document.body.classList.add("playing");
  running = true;
  renderHud();
  renderWeapons();
}

function gameOver() {
  running = false;
  screen("Ruhlar seni yakaladı…", `Bölüm ${S.level + 1} · Puan: ${S.score}`, [
    { label: "Bu bölümü tekrar dene<small>Açılan büyüler ve yetenekler korunur</small>", fn: () => { Object.assign(S, snapshot, { hp: snapshot.maxHp }); S.unlocked = [...snapshot.unlocked]; introLevel(); } },
    { label: "Baştan başla", fn: () => { newRun(); introLevel(); } },
  ]);
}

function levelClear() {
  const L = LEVELS[S.level];
  running = false;
  const bonus = Math.ceil(timeLeft) * 2;
  S.score += bonus + 100 * (S.level + 1);
  renderHud();
  if (S.level === LEVELS.length - 1) {
    screen("Şafak doğdu!", `Gölge Kral yenildi. Lanet kalktı.<br>Toplam puan: <b>${S.score}</b>`, [
      { label: "Yeniden oyna", fn: () => { newRun(); introLevel(); } },
    ]);
    return;
  }
  let rewardText = "";
  if (L.reward && !S.unlocked.includes(L.reward)) {
    S.unlocked.push(L.reward);
    rewardText = `<br>Yeni büyü: <b>${WEAPONS[L.reward].name}</b> (${WEAPONS[L.reward].key} tuşu)`;
  }
  if (S.hp < S.maxHp) S.hp++;
  const choices = [...PERKS].sort(() => Math.random() - 0.5).slice(0, 3);
  screen(`Bölüm ${S.level + 1} tamam!`, `Süre bonusu: +${bonus}${rewardText}<br>Bir yetenek seç:`, choices.map((p) => ({
    label: `${p.name}<small>${p.desc}</small>`,
    fn: () => { p.apply(); S.level++; introLevel(); },
  })));
}

let camK = 1;
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  camK = camera.aspect < 1 ? Math.min(1.6, 0.9 / camera.aspect) : 1;
  scene.fog.density = 0.035 / camK;
}
addEventListener("resize", resize);
resize();

// ---------- Döngü ----------
let mouseSeen = false;
addEventListener("mousemove", () => { mouseSeen = true; });
const mouseUsed = () => mouseSeen;
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hit = new THREE.Vector3();
const clock = new THREE.Clock();
const UP = new THREE.Vector3(0, 1, 0);

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  ring.rotation.z += dt * 0.3;
  const focus = wizard.position.clone().multiplyScalar(0.6);
  camera.position.set(focus.x, 17 * camK, focus.z + 12 * camK);
  camera.lookAt(focus);
  camera.updateMatrixWorld();
  pickups.forEach((p, i) => { p.mesh.position.y = 0.9 + Math.sin(t * 2.5 + i) * 0.2; p.mesh.rotation.y += dt * 1.5; });

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.position.addScaledVector(s.userData.v, dt);
    s.userData.v.y -= 9 * dt;
    s.userData.life -= dt;
    s.material.opacity = Math.max(s.userData.life / 0.6, 0);
    if (s.userData.life <= 0) { scene.remove(s); sparks.splice(i, 1); }
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    bolts[i].userData.life -= dt;
    bolts[i].material.opacity = Math.max(bolts[i].userData.life / 0.18, 0);
    if (bolts[i].userData.life <= 0) { scene.remove(bolts[i]); bolts.splice(i, 1); }
  }

  if (running) {
    cooldown -= dt;
    invuln -= dt;

    // Hareket
    let dx = (keys.has("KeyD") || keys.has("ArrowRight")) - (keys.has("KeyA") || keys.has("ArrowLeft"));
    let dz = (keys.has("KeyS") || keys.has("ArrowDown")) - (keys.has("KeyW") || keys.has("ArrowUp"));
    if (joy) { dx += joy.dx; dz += joy.dy; }
    const dir = new THREE.Vector3(dx, 0, dz);
    if (dir.lengthSq() > 1) dir.normalize();
    wizard.position.addScaledVector(dir, BASE_SPEED * S.speedMul * dt);
    wizard.position.x = THREE.MathUtils.clamp(wizard.position.x, -ARENA + 0.5, ARENA - 0.5);
    wizard.position.z = THREE.MathUtils.clamp(wizard.position.z, -ARENA + 0.5, ARENA - 0.5);

    // Nişan: fare yerde nereyi gösteriyorsa; dokunmatikte yürüme yönü
    ray.setFromCamera(mouse, camera);
    if (joy || (isTouch && !mouseUsed())) {
      // dokunmatik: en yakın düşmana otomatik nişan, yoksa yürüme yönü
      const near = nearestEnemies(wizard.position, 1, 18)[0];
      if (near) aim.copy(near.mesh.position).sub(wizard.position).setY(0).normalize();
      else if (dir.lengthSq() > 0) aim.copy(dir).normalize();
    } else if (ray.ray.intersectPlane(groundPlane, hit)) {
      const d = hit.sub(wizard.position).setY(0);
      if (d.lengthSq() > 0.01) aim.copy(d.normalize());
    }
    if (fireHeld) cast();
    wizard.rotation.y = Math.atan2(aim.x, aim.z);
    wand.position.set(wizard.position.x, 2.2, wizard.position.z);
    wizard.visible = invuln <= 0 || Math.floor(t * 12) % 2 === 0;

    // Düşmanlar
    for (const e of [...enemies]) {
      e.slow = Math.max(e.slow - dt, 0);
      const spd = e.d.speed * (e.slow > 0 ? 0.35 : 1);
      const to = wizard.position.clone().sub(e.mesh.position).setY(0).normalize();
      if (e.d.zig) to.applyAxisAngle(UP, Math.sin(t * 5 + e.phase) * 0.9);
      e.mesh.position.addScaledVector(to, spd * dt);
      e.mesh.position.x = THREE.MathUtils.clamp(e.mesh.position.x, -ARENA - 1, ARENA + 1);
      e.mesh.position.z = THREE.MathUtils.clamp(e.mesh.position.z, -ARENA - 1, ARENA + 1);
      e.mesh.position.y = e.d.y + Math.sin(t * 3 + e.phase) * 0.3;
      e.mesh.material.emissiveIntensity = e.slow > 0 ? 0.2 : 1;
      e.mesh.material.color.setHex(e.slow > 0 ? 0x9fdcff : e.d.color);
      if (e.type === "golem" || e.type === "boss") e.mesh.rotation.y += dt;
      const flat = wizard.position.clone().setY(e.mesh.position.y);
      if (invuln <= 0 && e.mesh.position.distanceTo(flat) < e.d.r + 0.5) {
        damagePlayer(e.d.dmg);
        if (!running) return;
      }
    }

    // Mermiler
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      s.mesh.position.addScaledVector(s.v, dt);
      s.life -= dt;
      let gone = s.life <= 0;
      for (const e of enemies) {
        if (gone) break;
        if (s.mesh.position.distanceTo(e.mesh.position) < e.d.r + 0.3) {
          gone = true;
          hurt(e, s.dmg, s.slow);
        }
      }
      if (gone) { scene.remove(s.mesh); shots.splice(i, 1); }
      if (!running) return;
    }

    // Toplananlar
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      const flat = wizard.position.clone().setY(p.mesh.position.y);
      const dist = p.mesh.position.distanceTo(flat);
      if (S.magnet && dist < S.magnet) p.mesh.position.addScaledVector(flat.sub(p.mesh.position).normalize(), 9 * dt);
      if (dist < 1.2) {
        scene.remove(p.mesh);
        pickups.splice(i, 1);
        if (p.type === "heart") {
          S.hp = Math.min(S.hp + 1, S.maxHp);
          burst(p.mesh.position, 0xff3b5c, 14);
        } else {
          collected++;
          S.score += 10;
          burst(p.mesh.position, 0x5ee7ff);
          if (pickups.filter((q) => q.type === "crystal").length < 5) spawnCrystal();
          if (!LEVELS[S.level].boss && collected >= LEVELS[S.level].goal) { levelClear(); return; }
        }
      }
    }

    // Yeni düşman doğurma
    const L = LEVELS[S.level];
    spawnTimer += dt;
    if (spawnTimer > L.every && enemies.length < L.cap) {
      spawnTimer = 0;
      const types = Object.keys(L.spawn);
      for (let k = 0; k < types.length; k++) spawnEnemy(types[Math.floor(Math.random() * types.length)]);
    }
    if (bossRef) {
      bossSummon -= dt;
      if (bossSummon <= 0) { bossSummon = 6; spawnEnemy("ghost"); spawnEnemy("ghost"); }
    }

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; renderHud(); gameOver(); }
    renderHud();
  }
  renderer.render(scene, camera);
});

// Açılış ekranı
renderWeapons();
screen("Büyücünün Gecesi", "5 lanetli bölümden geç. Mana kristallerini topla, düşmanları büyüyle durdur, yeni büyüler ve yetenekler kazan.<br>WASD / ok tuşları: yürü · Fare: nişan · Boşluk / tık: büyü · 1-4: büyü seç<br><small>Mobilde: ekranda parmağını sürükleyerek yürü, sağ alttaki ✦ butonuna basılı tutarak ateş et (nişan otomatik). Alttaki simgelerle büyü değiştir.</small>", [
  { label: "Büyüyü Başlat", fn: introLevel },
]);
</script>
</body>
</html>
